/* KECHI WOMAN sanal showroom v10
   Yedi duvar yan yana; kamera sekmeyle sağdan sola kayar. Her duvar: tek kaçış noktalı oda (SVG), arka duvarda kategori adı,
   yan duvar pencerelerinde gerçek çekim videoları, zeminde baştan ayağa eksiksiz mankenler (yalnız kendi ürün fotoğraflarımız).
   Telefonda da aynı kompozisyon: sahne bir "kutu" içinde ölçeklenir, üstü tavan, altı zemin dolgusuyla uzar.
   Yürüyen mankenler (podyum) duvar açılınca yürür, son karede diğerleriyle aynı boy ve ayak çizgisinde durur; asla solmaz. */
:root {
  --tavan: #E9E6E0;
  --zemin: #C9C2B7;
  --mese: #C9A57A;
  --koyu: #141210;
  --yazi: rgba(42, 36, 32, 0.88);
  --is: #7C6F62;
  --beyaz: #FFFFFF;
  --govde: "Outfit", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #EDEAE5; color: var(--koyu); font-family: var(--govde); -webkit-font-smoothing: antialiased; }

.sahne { position: relative; width: 100%; height: 100vh; height: 100dvh; max-height: 920px; min-height: 320px; overflow: hidden; background: var(--tavan); }
/* kutu dışında kalan alan: üstte tavan, altta zemin (oda SVG'sinin kenar renkleriyle birebir) */
.zemin-dolgu { position: absolute; left: 0; bottom: 0; width: 100%; display: block; pointer-events: none; }
.kutu { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
.ray { position: absolute; inset: 0; display: flex; will-change: transform;
  transition: transform 900ms cubic-bezier(0.65, 0, 0.35, 1); }
.sahne.kayiyor .ray { animation: dolly 900ms cubic-bezier(0.65, 0, 0.35, 1); }
@keyframes dolly { 0% { scale: 1; } 50% { scale: 0.97; } 100% { scale: 1; } }

.koy { position: relative; flex: none; height: 100%; overflow: hidden; }
.koy svg.oda { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
/* sol üstten tek ışık: tüm sahneye ortak, yumuşak */
.koy::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 6;
  background: radial-gradient(60% 45% at 30% 0%, rgba(255, 240, 215, 0.18), transparent); mix-blend-mode: soft-light; }

.duvar-yazi { position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 1;
  font-weight: 300; letter-spacing: 0.18em; margin-right: -0.18em; line-height: 1; color: var(--yazi); white-space: nowrap;
  text-shadow: 0 1px 0 rgba(255, 250, 240, 0.7), 0 -1px 0 rgba(120, 100, 80, 0.08); }

/* masaüstü Chromium: yan duvar video pencereleri, projektif matrix3d ile duvara oturtulur */
.pencere { position: absolute; left: 0; top: 0; width: 180px; height: 320px; transform-origin: 0 0; z-index: 1;
  border: 7px solid var(--mese); background: #2a2622; overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25), 0 6px 18px rgba(20, 18, 16, 0.12); }
.pencere video { width: 100%; height: 100%; object-fit: cover; display: block; }
/* Safari/iOS/Firefox ve dokunmatik: perspektifli dönüşüm yok. Pencere kanvasa dikey şeritlerle çizilir; altında 2B afin + kırpılmış video
   (oynatma politikası için görünür kalır, kanvas çizemezse yedek görüntüdür). Video oynamazsa poster çizilir. */
.pencere-duz { position: absolute; z-index: 1; overflow: hidden; }
.pencere-duz video { position: absolute; left: 0; top: 0; width: 166px; height: 306px; object-fit: cover; transform-origin: 0 0; display: block; }
.pencere-duz canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* mankenler */
.sira { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.m { position: absolute; pointer-events: none; z-index: 1; }
.m.podyum { z-index: 0; }
.m .foto, .m .yansima, .m .dusen { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
.m .foto { z-index: 2; filter: sepia(0.06) saturate(0.95) drop-shadow(0 0 0.5px rgba(40, 30, 20, 0.25));
  transform-origin: 50% 100%; transition: transform 260ms ease; }
.m .yansima { z-index: 0; top: 100%; transform: scaleY(-1); opacity: 0.075; filter: sepia(0.06) saturate(0.9) blur(0.6px);
  -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 16%); mask-image: linear-gradient(to top, #000 0%, transparent 16%); }
.m .dusen { z-index: 0; opacity: 0.065; filter: brightness(0) blur(5px); transform-origin: 50% 100%;
  transform: skewX(-38deg) scaleY(0.2); }
.m .temas, .m .ortam { position: absolute; z-index: 1; border-radius: 50%; pointer-events: none; transition: opacity 260ms ease; }
.m .temas { background: radial-gradient(closest-side, rgba(52, 36, 22, 0.62), rgba(52, 36, 22, 0)); filter: blur(2px); }
.m .ortam { background: radial-gradient(closest-side, rgba(60, 40, 25, 0.2), rgba(60, 40, 25, 0)); filter: blur(9px); }
.m .dokun { position: absolute; z-index: 3; inset: 0 8%; background: none; border: 0; padding: 0; cursor: pointer; pointer-events: auto; border-radius: 40px; }
.sahne.dar .m .dokun { inset: 0; border-radius: 12px; }   /* ölçekli sahnede dokunma alanı mankenin tamamı */
.m .dokun:focus-visible { outline: 2px solid var(--koyu); outline-offset: 4px; }
.m:hover .foto, .m.secili .foto { transform: scale(1.02); }
.m .temas { opacity: 0.9; } .m .ortam { opacity: 0.9; }
.m:hover .temas, .m.secili .temas, .m:hover .ortam, .m.secili .ortam { opacity: 1; }

/* geçişte 60 ms arayla giriş */
.koy.giris .m { animation: gir 520ms cubic-bezier(0.2, 0.7, 0.2, 1) both; animation-delay: calc(360ms + var(--i) * 60ms); }
@keyframes gir { from { opacity: 0; translate: 0 12px; } to { opacity: 1; translate: 0 0; } }

/* podyum: gerçek çekimden yürüyen manken. Chrome/Firefox: saydam WebM; Safari/iOS: kanvasta kare dizisi.
   Altta her zaman son karenin sabit görüntüsü durur; manken hiçbir anda kaybolmaz. */
.m.podyum video, .m.podyum canvas, .m.podyum img.sabit { position: absolute; display: block; z-index: 2; pointer-events: none;
  filter: sepia(0.06) saturate(0.95); }
.m.podyum img.sabit.gizli, .m.podyum video.gizli { visibility: hidden; }
.koy.hazirlik .m { opacity: 0; }
.m.podyum .temas, .m.podyum .ortam { transition: none; }

/* ürün kartı (toptan) */
.kart { position: absolute; z-index: 30; width: min(318px, calc(100vw - 32px)); display: flex; gap: 12px; padding: 12px;
  background: var(--beyaz); border-radius: 14px; box-shadow: 0 18px 44px rgba(20, 18, 16, 0.22); color: inherit; }
.kart .gorsel { width: 76px; height: 112px; flex: none; border-radius: 8px; background: #EEEBE6; overflow: hidden; position: relative; }
.kart .gorsel img { position: absolute; left: 50%; top: 6px; height: 210%; transform: translateX(-50%); }
.kart .bilgi { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.kart .kod { font-size: 0.64rem; letter-spacing: 0.14em; color: var(--is); text-transform: uppercase; }
.kart .ad { font-size: 0.86rem; line-height: 1.28; font-weight: 500; }
.kart .seri { font-size: 0.72rem; color: #5a524a; }
.kart .fiyat { font-size: 0.8rem; font-variant-numeric: tabular-nums; color: #2e2924; font-weight: 500; }
.kart .fiyat small { font-weight: 400; color: #6a6159; font-size: 0.68rem; }
.kart .stok { font-size: 0.7rem; color: #3f6b46; display: flex; align-items: center; gap: 5px; }
.kart .stok::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.kart .stok.on { color: #8a6a2c; }
.kart .eylem { display: flex; gap: 6px; margin-top: 6px; }
.kart .eylem a { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; text-decoration: none;
  padding: 8px 10px; border-radius: 999px; white-space: nowrap; }
.kart .eylem .ana { background: var(--koyu); color: var(--beyaz); }
.kart .eylem .ikincil { color: var(--koyu); box-shadow: inset 0 0 0 1px rgba(20, 18, 16, 0.22); }
.kart .eylem a:focus-visible { outline: 2px solid var(--koyu); outline-offset: 2px; }
.kart .kapat { position: absolute; right: 6px; top: 6px; width: 28px; height: 28px; border: 0; background: none; cursor: pointer;
  color: #8b8178; font-size: 18px; line-height: 1; border-radius: 50%; }

.ust { position: absolute; z-index: 40; left: 0; right: 0; top: calc(14px + env(safe-area-inset-top, 0px));
  display: flex; justify-content: space-between; align-items: center; padding-inline: max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.logo { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.42em; color: var(--koyu); }
.ipucu { font-size: 0.64rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--is); }

.sekmeler { position: absolute; z-index: 40; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 4px; padding: 5px; max-width: calc(100% - 32px); overflow-x: auto; scrollbar-width: none;
  background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px); border-radius: 999px; box-shadow: 0 8px 26px rgba(20, 18, 16, 0.14); }
.sekmeler::-webkit-scrollbar { display: none; }
.sekme { flex: none; font-family: var(--govde); font-size: 0.76rem; font-weight: 500; padding: 9px 15px; border-radius: 999px;
  border: 0; background: transparent; color: #4a443e; cursor: pointer; transition: background 200ms ease, color 200ms ease; white-space: nowrap; }
.sekme:hover { background: rgba(20, 18, 16, 0.06); }

.sekme:focus-visible { outline: 2px solid var(--koyu); outline-offset: 2px; }
.sahne.dar .ipucu { display: none; }
/* telefon: odanın altında o duvarın ürün şeridi (yatay kaydırılır; dokununca aynı ürün kartı) */
.serit { position: absolute; left: 0; right: 0; z-index: 20; display: none; flex-direction: column; background: #F4F1EC;
  border-top: 1px solid rgba(60, 45, 30, 0.14); }
.sahne.tel .serit { display: flex; }
.serit-baslik { display: flex; justify-content: space-between; align-items: baseline; padding: 10px 16px 8px;
  font-size: 0.6rem; letter-spacing: 0.18em; text-transform: uppercase; color: var(--is); }
.serit-baslik b { font-weight: 500; color: var(--koyu); }
.serit-liste { flex: 1; min-height: 0; display: flex; gap: 10px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory;
  padding: 0 16px 10px; scroll-padding-inline: 16px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.serit-liste::-webkit-scrollbar { display: none; }
.urun { flex: none; width: 118px; scroll-snap-align: start; display: flex; flex-direction: column; gap: 3px; padding: 7px; margin: 0;
  background: var(--beyaz); border: 1px solid rgba(60, 45, 30, 0.08); border-radius: 12px; text-align: left; font-family: var(--govde);
  color: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; }
.urun:focus-visible { outline: 2px solid var(--koyu); outline-offset: 2px; }
.urun .g { flex: 1; min-height: 60px; display: flex; justify-content: center; align-items: flex-end; overflow: hidden;
  background: #EEEBE6; border-radius: 8px; padding-top: 4px; }
.urun .g img { height: 100%; width: 100%; object-fit: contain; object-position: 50% 100%; display: block; }
.urun .k { margin-top: 3px; font-size: 0.56rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--is); }
.urun .a { font-size: 0.7rem; line-height: 1.22; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; min-height: 2.44em; }
.urun .f { font-size: 0.68rem; font-weight: 500; font-variant-numeric: tabular-nums; color: #2e2924; }
.urun .f small { display: block; font-weight: 400; font-size: 0.58rem; color: #6a6159; }
.urun.secili { border-color: var(--koyu); }
@media (max-width: 700px) {
  .kart { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); width: auto;

}
@media (prefers-reduced-motion: reduce) {
  .ray { transition: none; } .sahne.kayiyor .ray { animation: none; } .koy.giris .m { animation: none; }
}

// Ölçü. Geniş ekranda sahne olduğu gibi; dar ekranda (telefon, dikey tablet) aynı kompozisyon ODA_W×ODA_H sanal
// boyutta kurulur ve ekran genişliğine ölçeklenir. Kutunun üstü tavan, altı zemin dolgusudur.
function boyutla() {
  const SW = sahne.clientWidth, SH = sahne.clientHeight;
  const dar = SW / SH < 1.6;
  const tel = dar && SW <= 700;     // telefon: oda başlığın altında, altında ürün şeridi
  sahne.classList.toggle("dar", dar);
  sahne.classList.toggle("tel", tel);
  let W = SW, H = SH, s = 1, ust = 0;
  if (tel) {
    const odaH = Math.min(SH * 0.44, SW * 0.88);
    const logoAlt = document.querySelector(".ust").getBoundingClientRect().bottom - sahne.getBoundingClientRect().top;
    H = ODA_H; W = Math.round(H * SW / odaH); s = SW / W; ust = Math.round(logoAlt + 10);
  } else if (dar) { H = ODA_H; W = Math.max(ODA_W, Math.round(H * SW / SH)); s = SW / W; ust = Math.round((SH - H * s) * 0.34); }
  olcu = { W, H, s, ust, dar, tel };
  if (tel) {
    const serit = document.getElementById("serit");
    const tepe = ust + H * s;
    serit.style.top = tepe + "px";
    serit.style.bottom = (SH - sekmeler.getBoundingClientRect().top + sahne.getBoundingClientRect().top + 8) + "px";
  }
  kutu.style.width = W + "px"; kutu.style.height = H + "px";
  kutu.style.transform = dar ? "translate(0," + ust + "px) scale(" + s + ")" : "none";
  // zemin dolgusu: oda SVG'sinin alt kenarındaki renk ve dokunun devamı (aynı birim ölçeğinde)
  const alt = dar && !tel ? SH - ust - H * s : 0;
  zeminDolgu.style.height = Math.max(0, Math.ceil(alt) + 1) + "px";
  zeminDolgu.style.display = alt > 0 ? "block" : "none";
  if (alt > 0) {
    const vb = 1000, vh = alt / (W * s) * 1000 * (W / H) * 0.6;   // oda viewBox'ı 1000x600'ün birimiyle
    zeminDolgu.setAttribute("viewBox", "0 0 " + vb + " " + vh);
    zeminDolgu.innerHTML = '<defs><linearGradient id="zd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9C2B7"/><stop offset="1" stop-color="#C3BCB1"/></linearGradient>' +
      '<filter id="zdk" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.75 1.6" numOctaves="3" seed="7"/>' +
      '<feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.29  0 0 0 0 0.22  0 0 0 0.55 0"/></filter></defs>' +
      '<rect width="' + vb + '" height="' + vh + '" fill="url(#zd)"/><rect width="' + vb + '" height="' + vh + '" filter="url(#zdk)" opacity="0.32"/>';
  }

  const ayakY = H * 0.885;
  const boy = H * 0.62;
  ray.querySelectorAll(".koy").forEach((koy, n) => {
    koy.style.width = W + "px";
    const yazi = koy.querySelector(".duvar-yazi");
    const fs = (tel ? Math.min(H * 0.07, W * 0.06) : Math.min(W * 0.052, H * 0.085, 84)) * (DUVAR[n].ad.length > 8 ? 0.82 : 1);
    yazi.style.fontSize = fs + "px";
    yazi.style.top = (H * (tel ? 0.15 : 0.118)) + "px";

    const els = Array.from(koy.querySelectorAll(".m"));
    const gen = els.map(el => boy * (el.dataset.s === "P" ? PODYUM[el.dataset.p].genislik : KESIM[el.dataset.s].o));
    const ara = boy * 0.005;                              // kollar birbirine değmesin diye küçük aralık
    const toplam = gen.reduce((t, g) => t + g, 0) + ara * (els.length - 1);
    // sığmazsa tüm duvar birlikte küçülür. Masaüstünde dizi pencerelerin arasında kalır; telefonda ekran genişliğine yayılır
    const olcek = Math.min(1, W * (tel ? 0.96 : 0.72) / toplam);
    const b = boy * olcek;
    let x = (W - toplam * olcek) / 2;
    els.forEach((el, i) => {
      const w = gen[i] * olcek;
      el.style.left = x + "px"; el.style.top = (ayakY - b) + "px"; el.style.width = w + "px"; el.style.height = b + "px";
      if (el.dataset.s === "P") podyumOlcu(el, b);
      else golgeYerlestir(el, KESIM[el.dataset.s].ax, KESIM[el.dataset.s].aw, w, b);
      x += (gen[i] + ara) * olcek;
    });

    koy.querySelectorAll(".pencere").forEach((p, i) => {
      p.style.transform = matris(180, 320, PENCERE[i].map(([px, py]) => [px / 1000 * W, py / 600 * H]));
    });
    koy.querySelectorAll(".pencere-duz").forEach((p, i) => pencereDuzOlcu(p, PENCERE[i].map(([px, py]) => [px / 1000 * W, py / 600 * H])));
  });
}

// Dokunmatik pencere: kutu = dörtgenin sınır kutusu, dörtgene kırpılır. Video 2B afin (üç köşe) ile yerleşir;
// kanvas dış çerçeveyi ve içi gerçek perspektifle (dikey şeritler) çizer.
function pencereDuzOlcu(p, k) {
  const x0 = Math.min(k[0][0], k[2][0]), x1 = Math.max(k[1][0], k[3][0]);
  const y0 = Math.min(k[0][1], k[1][1]), y1 = Math.max(k[2][1], k[3][1]);
  const bw = x1 - x0, bh = y1 - y0;
  p.style.left = x0 + "px"; p.style.top = y0 + "px"; p.style.width = bw + "px"; p.style.height = bh + "px";
  const yerel = k.map(([x, y]) => [x - x0, y - y0]);
  p.style.clipPath = "polygon(" + [yerel[0], yerel[1], yerel[3], yerel[2]].map(([x, y]) => x.toFixed(2) + "px " + y.toFixed(2) + "px").join(",") + ")";
  const t = homografi(180, 320, yerel);
  p._t = t; p._bw = bw; p._bh = bh;
  const a = esle(t, 7, 7), bR = esle(t, 173, 7), c = esle(t, 7, 313);
  p.querySelector("video").style.transform = "matrix(" + [(bR[0] - a[0]) / 166, (bR[1] - a[1]) / 166, (c[0] - a[0]) / 306, (c[1] - a[1]) / 306, a[0], a[1]].map(z => z.toFixed(5)).join(",") + ")";
  const cv = p.querySelector("canvas");
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width = Math.max(2, Math.round(bw * olcu.s * dpr)); cv.height = Math.max(2, Math.round(bh * olcu.s * dpr));
  pencereCiz(p);
}
let araKanvas = null;
function pencereCiz(p) {
  const t = p._t; if (!t) return;
  const cv = p.querySelector("canvas"), ctx = cv.getContext("2d"), v = p.querySelector("video");
  const q = cv.width / p._bw;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(q, 0, 0, q, 0, 0);
  const yol = (u0, v0, u1, v1) => { ctx.beginPath(); [[u0, v0], [u1, v0], [u1, v1], [u0, v1]].forEach(([u, w], j) => { const [x, y] = esle(t, u, w); j ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }); ctx.closePath(); };
  yol(0, 0, 180, 320); ctx.fillStyle = "#C9A57A"; ctx.fill();
  // kaynak: oynayan video karesi, yoksa poster; ikisi de yoksa sıcak koyu zemin
  let src = null, sw = 0, sh = 0;
  if (v.readyState >= 2 && v.videoWidth && (v.currentTime > 0 || !v.paused)) { src = v; sw = v.videoWidth; sh = v.videoHeight; }
  else if (p._poster) { src = p._poster; sw = src.naturalWidth; sh = src.naturalHeight; }
  ctx.save(); yol(7, 7, 173, 313); ctx.clip();
  if (src) {
    // önce küçük ara kanvasa object-fit: cover ile tek çizim, sonra şeritler
    const ow = 166 * 2, oh = 306 * 2;
    if (!araKanvas) araKanvas = document.createElement("canvas");
    araKanvas.width = ow; araKanvas.height = oh;
    const ac = araKanvas.getContext("2d");
    const r = Math.max(ow / sw, oh / sh), cw = ow / r, ch = oh / r;
    try { ac.drawImage(src, (sw - cw) / 2, (sh - ch) / 2, cw, ch, 0, 0, ow, oh); } catch (e) { src = null; }
    if (src) {
      const N = 36;
      for (let j = 0; j < N; j++) {
        const u0 = 7 + 166 * j / N, u1 = 7 + 166 * (j + 1) / N, um = (u0 + u1) / 2;
        const xa = esle(t, u0, 7)[0], xb = esle(t, u1, 7)[0];
        const ya = esle(t, um, 7)[1], yb = esle(t, um, 313)[1];
        ctx.drawImage(araKanvas, ow * j / N, 0, ow / N, oh, xa, ya - 0.5, xb - xa + 0.6, yb - ya + 1);
      }
    }
  }
  if (!src) { ctx.fillStyle = "#3a332d"; ctx.fill(); }
  ctx.restore();
  yol(7, 7, 173, 313); ctx.strokeStyle = "rgba(0,0,0,0.25)"; ctx.lineWidth = 1 / q; ctx.stroke();

}
let pencereRaf = 0;
function pencereDongu() {
  cancelAnimationFrame(pencereRaf);
  const ps = Array.from(ray.children[aktif].querySelectorAll(".pencere-duz"));
  if (!ps.length) return;
  const son = ps.map(() => -1);
  const dongu = () => {
    ps.forEach((p, i) => { const v = p.querySelector("video"); if (v.currentTime !== son[i] || p.dataset.durum !== "video") { son[i] = v.currentTime; pencereCiz(p); } });
    pencereRaf = requestAnimationFrame(dongu);
  };
  pencereRaf = requestAnimationFrame(dongu);
}

// iki katlı sıcak temas gölgesi; ayak genişliğine göre, ayak çizgisinin 2 px üstüne biner
function golgeYerlestir(el, ax, aw, w, b) {
  const tw = Math.max(0.42, Math.min(0.7, aw * 1.05 + 0.16)) * w;
  const t = el.querySelector(".temas"), o = el.querySelector(".ortam");
  const th = Math.max(8, b * 0.026);
  t.style.width = tw + "px"; t.style.height = th + "px";
  t.style.left = (ax * w - tw / 2) + "px"; t.style.top = (b - th / 2 - 2) + "px";
  const ow = tw * 1.9 + w * 0.15, oh = Math.max(22, b * 0.072);
  o.style.width = ow + "px"; o.style.height = oh + "px";
  o.style.left = (ax * w - ow / 2) + "px"; o.style.top = (b - oh / 2) + "px";
}

// Podyum yerleşimi: son karede manken diğerleriyle aynı boyda ve aynı ayak çizgisinde durur;
// öncesinde arkadan yürüyerek gelir (perspektifle biraz küçük ve geride). Gölge kare kare ayağı izler.
function podyumOlcu(el, b) {
  const P = PODYUM[el.dataset.p], s = b / P.boyE;
  const w = parseFloat(el.style.width);
  el._s = s; el._b = b;
  el._x0 = w / 2 - P.cxE * s;
  el._y0 = b - P.ayakE * s;
  el.querySelectorAll("video, canvas, img.sabit").forEach(o => {
    o.style.width = P.W * s + "px"; o.style.height = P.H * s + "px";
    o.style.left = el._x0 + "px"; o.style.top = el._y0 + "px";
  });
  const cv = el.querySelector("canvas.pk");
  if (cv) {
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    cv.width = Math.min(P.sprite.w, Math.round(P.W * s * olcu.s * dpr)); cv.height = Math.round(cv.width * P.H / P.W);
    if (el._kare != null) spriteCiz(el, el._kare);
  }
  podyumGolge(el, el._kare == null ? P.kare.length - 1 : el._kare);
}
function podyumGolge(el, f) {
  const P = PODYUM[el.dataset.p], k = P.kare[Math.max(0, Math.min(P.kare.length - 1, f))], s = el._s;
  if (!s) return;
  const bb = el._b * k[3] / P.boyE;   // o karedeki görünen boy
  const cx = el._x0 + k[0] * s, y = el._y0 + k[2] * s;
  const tw = Math.max(bb * 0.15, Math.min(bb * 0.24, k[1] * s * 1.05 + bb * 0.06)), th = Math.max(8, bb * 0.026);
  const ow = tw * 1.9 + bb * 0.05, oh = Math.max(22, bb * 0.072);
  const t = el.querySelector(".temas"), o = el.querySelector(".ortam");
  t.style.cssText = "width:" + tw + "px;height:" + th + "px;left:" + (cx - tw / 2) + "px;top:" + (y - th / 2 - 2) + "px";
  o.style.cssText = "width:" + ow + "px;height:" + oh + "px;left:" + (cx - ow / 2) + "px;top:" + (y - oh / 2) + "px";
}

// Safari/iOS kare dizisi
function spriteCiz(el, f) {
  const P = PODYUM[el.dataset.p], im = el._sprite, cv = el.querySelector("canvas.pk");
  if (!im || !im.complete || !im.naturalWidth) return false;
  const c = cv.getContext("2d"), sp = P.sprite;
  c.clearRect(0, 0, cv.width, cv.height);
  c.drawImage(im, (f % sp.c) * sp.w, Math.floor(f / sp.c) * sp.h, sp.w, sp.h, 0, 0, cv.width, cv.height);
  el._kare = f;
  el.querySelector("img.sabit").classList.add("gizli");
  return true;
}
function spriteYukle(el) {
  if (el._sprite) return;
  const im = new Image();
  im.decoding = "async";
  im.src = PODYUM[el.dataset.p].sprite.src;
  el._sprite = im;
}

// Duvar açılınca o duvarın yürüyen mankeni baştan yürür ve son karede durur.
let podyumRaf = 0;
const AZ_HAREKET = matchMedia("(prefers-reduced-motion: reduce)").matches;
// Yürüyüş, manken giriş animasyonuyla görünmeye başladığı anda (esik) başlar; o ana kadar ilk karede bekler.
// esik'e kadar ilk kare hazır değilse manken son karede durmaya devam eder: kaybolmaz, sıçramaz.
function podyumlar() {
  cancelAnimationFrame(podyumRaf);
  ray.querySelectorAll(".koy").forEach((k, i) => {
    if (Math.abs(i - aktif) <= 1 && SAFARI) k.querySelectorAll(".podyum").forEach(spriteYukle);
    if (i !== aktif) k.querySelectorAll(".podyum video").forEach(v => v.pause());
  });
  const els = Array.from(ray.children[aktif].querySelectorAll(".podyum"));
  if (!els.length) return;
  const acilis = performance.now();
  const esik = el => AZ_HAREKET ? 0 : 360 + (+el.style.getPropertyValue("--i") || 0) * 60;
  const durum = els.map(() => ({ ilk: false, basladi: false, bitti: false, t0: 0 }));
  els.forEach(el => {
    if (SAFARI) return;
    const v = el.querySelector("video");
    v.preload = "auto"; v.pause();
    const sar = () => { try { v.currentTime = 0; } catch (e) {} };
    if (v.readyState >= 1) sar(); else v.addEventListener("loadedmetadata", sar, { once: true });
  });
  const dur = (el, P, d) => { d.bitti = true; el._kare = P.kare.length - 1; podyumGolge(el, P.kare.length - 1); el.dataset.durum = "duruyor"; };
  const dongu = now => {
    let devam = false;
    els.forEach((el, j) => {
      const P = PODYUM[el.dataset.p], d = durum[j], sabit = el.querySelector("img.sabit");
      if (d.bitti) return;
      const vakit = now - acilis >= esik(el);
      if (SAFARI) {
        const im = el._sprite, hazir = im && im.complete && im.naturalWidth;
        if (!d.basladi) {
          if (hazir && !d.ilk) { d.ilk = true; spriteCiz(el, 0); podyumGolge(el, 0); }
          if (!vakit) { devam = true; return; }
          if (!d.ilk) { dur(el, P, d); return; }
          d.basladi = true; d.t0 = now;
        }
        const f = Math.min(P.kare.length - 1, Math.floor((now - d.t0) / 1000 * P.fps));
        if (f !== el._kare) { spriteCiz(el, f); podyumGolge(el, f); }
        el.dataset.durum = f < P.kare.length - 1 ? "yuruyor" : "duruyor";
        if (f >= P.kare.length - 1) d.bitti = true; else devam = true;
      } else {
        const v = el.querySelector("video");
        if (!d.basladi) {
          const ilkKare = v.readyState >= 2 && !v.seeking && v.currentTime < 0.05;
          if (ilkKare && !d.ilk) { d.ilk = true; v.classList.remove("gizli"); sabit.classList.add("gizli"); el._kare = 0; podyumGolge(el, 0); }
          if (!vakit) { devam = true; return; }
          if (!d.ilk) { v.classList.add("gizli"); sabit.classList.remove("gizli"); dur(el, P, d); return; }
          d.basladi = true; const p = v.play(); if (p) p.catch(() => {});
        }
        const f = Math.round(v.currentTime * P.fps);
        el._kare = f; podyumGolge(el, f);
        el.dataset.durum = v.ended ? "duruyor" : "yuruyor";
        if (v.ended) dur(el, P, d); else devam = true;
      }
    });
    if (devam) podyumRaf = requestAnimationFrame(dongu);
  };
  podyumRaf = requestAnimationFrame(dongu);
}

function videolar() {
  ray.querySelectorAll(".koy").forEach((k, i) => k.querySelectorAll(".pencere video, .pencere-duz video").forEach(v => {
    if (i === aktif) { v.preload = "auto"; const p = v.play(); if (p) p.catch(() => {}); }
    else v.pause();
  }));
  pencereDongu();
  podyumlar();
}
// iOS düşük güç modunda kendiliğinden oynatma reddedilir; ilk dokunuşta yeniden denenir (poster zaten görünür)
["touchend", "click"].forEach(ev => document.addEventListener(ev, () => {
  ray.children[aktif].querySelectorAll(".pencere video, .pencere-duz video").forEach(v => { if (v.paused) { const p = v.play(); if (p) p.catch(() => {}); } });
}, { passive: true }));

function git(n) {
  if (n === aktif) return;
  kartKapat();
  aktif = n;
  yukle(n); yukle(n + 1); yukle(n - 1);
  sekmeler.querySelectorAll(".sekme").forEach((s, i) => s.setAttribute("aria-selected", i === n ? "true" : "false"));
  const sk = sekmeler.children[n];   // scrollIntoView sahneyi de kaydırır; yalnız sekme çubuğu kaydırılır
  sekmeler.scrollTo({ left: sk.offsetLeft - (sekmeler.clientWidth - sk.offsetWidth) / 2, behavior: "smooth" });
  sahne.classList.remove("kayiyor");
  void sahne.offsetWidth;
  sahne.classList.add("kayiyor");
  const koy = ray.children[n];
  koy.classList.remove("giris"); void koy.offsetWidth; koy.classList.add("giris");
  ray.style.transform = "translateX(" + (-n * olcu.W) + "px)";
  seritKur(n);
  ray.querySelectorAll(".koy").forEach((k, i) => k.querySelectorAll(".dokun").forEach(b => { b.tabIndex = i === n ? 0 : -1; }));
  videolar();
}

// telefon ürün şeridi: duvarın mankenleri sırasıyla (yürüyen manken dahil)
function seritKur(n) {
  const liste = document.getElementById("seritListe");
  const els = Array.from(ray.children[n].querySelectorAll(".m"));
  document.getElementById("seritSay").textContent = els.length + " ürün";
  liste.innerHTML = "";
  els.forEach(el => {
    const P = el.dataset.p ? PODYUM[el.dataset.p] : null;
    const kod = P ? P.kod : el.dataset.s.slice(0, 4), u = URUN[kod];
    const gorsel = P ? P.kart : "m3/" + el.dataset.s + ".webp";
    const slug = P ? P.url : KESIM[el.dataset.s].u, st = P ? 1 : KESIM[el.dataset.s].st;
    const b = document.createElement("button");
    b.type = "button"; b.className = "urun";
    b.setAttribute("aria-label", u.ad + ", kod " + kod + ", seri kartını aç");
    b.innerHTML = '<span class="g"><img alt="" loading="lazy" src="' + gorsel + '"></span><span class="k">Kod ' + kod + '</span><span class="a">' + u.ad + '</span>' +
      '<span class="f">Seri ' + TL(u.seri) + ' TL<small>adet ' + TL(Math.round(u.seri / 6)) + ' TL · KDV dahil</small></span>';
    b.addEventListener("click", e => { e.stopPropagation(); kartAc(el, kod, slug, st, gorsel); b.classList.add("secili"); });
    liste.appendChild(b);
  });
  liste.scrollLeft = 0;
}

function kartKapat() {
  if (acikKart) { acikKart.remove(); acikKart = null; }
  ray.querySelectorAll(".m.secili").forEach(m => m.classList.remove("secili"));
  document.querySelectorAll(".urun.secili").forEach(m => m.classList.remove("secili"));
}
function kartAc(el, kod, slug, stokta, gorsel) {
  kartKapat();
  const u = URUN[kod];
  const k = document.createElement("div");
  k.className = "kart";
  k.setAttribute("role", "dialog");
  k.setAttribute("aria-label", u.ad);
  k.innerHTML = '<span class="gorsel"><img alt="" src="' + gorsel + '"></span>' +
    '<span class="bilgi">' +
      '<span class="kod">Kod ' + kod + ' · ' + u.renk + ' renk</span>' +
      '<span class="ad">' + u.ad + '</span>' +
      '<span class="seri">6\'lı seri · 2S 2M 2L</span>' +
      '<span class="fiyat">Seri ' + TL(u.seri) + ' TL <small>· adet ' + TL(Math.round(u.seri / 6)) + ' TL · KDV dahil</small></span>' +
      '<span class="stok' + (stokta ? '' : ' on') + '">' + (stokta ? 'Stokta' : 'Ön sipariş') + '</span>' +
      '<span class="eylem"><a class="ana" href="https://kechiwoman.com/urun/' + slug + '" target="_blank" rel="noopener">Seriyi incele</a>' +
      '<a class="ikincil" href="https://kechiwoman.com/bayilik" target="_blank" rel="noopener">Bayi ol</a></span>' +
    '</span>' +
    '<button type="button" class="kapat" aria-label="Kartı kapat">×</button>';
  k.querySelector(".kapat").addEventListener("click", e => { e.stopPropagation(); kartKapat(); });
  if (innerWidth > 700) {
    const r = el.getBoundingClientRect(), s = sahne.getBoundingClientRect();
    let left = r.right - s.left - r.width * 0.12;
    if (left + 330 > s.width) left = r.left - s.left - 318 + r.width * 0.12;
    k.style.left = Math.max(16, Math.min(s.width - 334, left)) + "px";
    k.style.top = Math.max(60, Math.min(s.height - 250, r.top - s.top + r.height * 0.3)) + "px";
  }
  sahne.appendChild(k);
  el.classList.add("secili");
  acikKart = k;
}

sahne.addEventListener("click", e => { if (!e.target.closest(".kart, .dokun, .sekme, .urun")) kartKapat(); });
document.addEventListener("keydown", e => {
  if (e.key === "Escape") kartKapat();
  if (e.key === "ArrowRight") git(Math.min(DUVAR.length - 1, aktif + 1));
  if (e.key === "ArrowLeft") git(Math.max(0, aktif - 1));
});
ray.addEventListener("animationend", e => { if (e.target === ray) sahne.classList.remove("kayiyor"); });
addEventListener("resize", () => {
  ray.style.transition = "none";
  boyutla();
  ray.style.transform = "translateX(" + (-aktif * olcu.W) + "px)";
  void ray.offsetWidth; ray.style.transition = "";
  kartKapat();
});
ray.querySelectorAll(".koy").forEach((k, i) => k.querySelectorAll(".dokun").forEach(b => { b.tabIndex = i === 0 ? 0 : -1; }));
yukle(0); yukle(1);
boyutla();
seritKur(0);
// ilk açılış: ilk duvarın yürüyen mankeni hazır olana kadar (en çok 1,5 sn) mankenler görünmez, sonra giriş animasyonu
(function ilkAcilis() {
  const koy = ray.children[0], pd = Array.from(koy.querySelectorAll(".podyum"));
  if (SAFARI) pd.forEach(spriteYukle);
  koy.classList.add("hazirlik");
  const hazir = () => pd.every(el => SAFARI ? (el._sprite.complete && el._sprite.naturalWidth) : el.querySelector("video").readyState >= 3);
  const t0 = performance.now();
  const bak = () => {
    if (hazir() || performance.now() - t0 > 1500) { koy.classList.remove("hazirlik"); koy.classList.add("giris"); videolar(); }
    else setTimeout(bak, 60);
  };
  pd.forEach(el => { const v = el.querySelector("video"); if (v) { v.preload = "auto"; v.load(); } });
  bak();
})();
// sayfa yüklenince tüm görseller ve yürüyüşler önden yüklenir (duvar açılınca hazır olsun)
addEventListener("load", () => {
  const sonra = window.requestIdleCallback || (f => setTimeout(f, 600));
  sonra(() => { DUVAR.forEach((_, i) => yukle(i)); if (SAFARI) ray.querySelectorAll(".podyum").forEach(spriteYukle); });
});
</script>
