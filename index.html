/* KECHI WOMAN sanal showroom v13
   Yedi duvar yan yana; kamera sekmeyle sağdan sola kayar. Her duvar: tek kaçış noktalı oda (SVG), arka duvarda kategori adı,
   yan duvar pencerelerinde gerçek çekim videoları, zeminde baştan ayağa eksiksiz mankenler (yalnız kendi ürün fotoğraflarımız).
   Telefonda da aynı kompozisyon: sahne bir "kutu" içinde ölçeklenir, üstü tavan, altı zemin dolgusuyla uzar.
   Yürüyen mankenler (podyum) duvar açılınca yürür, son karede diğerleriyle aynı boy ve ayak çizgisinde durur; asla solmaz. */
:root {
  --tavan: #E9E6E0;
  --zemin: #C9C2B7;
  --mese: #C9A57A;
  --koyu: #141210;
  --yazi: rgba(42, 36, 32, 0.88);
  --is: #7C6F62;
  --beyaz: #FFFFFF;
  --govde: "Outfit", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: #EDEAE5; color: var(--koyu); font-family: var(--govde); -webkit-font-smoothing: antialiased; }

.sahne { position: relative; width: 100%; height: 100vh; height: 100dvh; max-height: 920px; min-height: 320px; overflow: hidden; background: var(--tavan); }
/* kutu dışında kalan alan: üstte tavan, altta zemin (oda SVG'sinin kenar renkleriyle birebir) */
.zemin-dolgu { position: absolute; left: 0; bottom: 0; width: 100%; display: block; pointer-events: none; }
.kutu { position: absolute; left: 0; top: 0; transform-origin: 0 0; overflow: hidden; }
.ray { position: absolute; inset: 0; display: flex; will-change: transform;
  transition: transform 900ms cubic-bezier(0.65, 0, 0.35, 1); }
.sahne.kayiyor .ray { animation: dolly 900ms cubic-bezier(0.65, 0, 0.35, 1); }
@keyframes dolly { 0% { scale: 1; } 50% { scale: 0.97; } 100% { scale: 1; } }

.koy { position: relative; flex: none; height: 100%; overflow: hidden; }
.koy svg.oda { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
/* sol üstten tek ışık: tüm sahneye ortak, yumuşak */
.koy::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 6;
  background: radial-gradient(60% 45% at 30% 0%, rgba(255, 240, 215, 0.18), transparent); mix-blend-mode: soft-light; }

.duvar-yazi { position: absolute; left: 0; right: 0; text-align: center; pointer-events: none; z-index: 1;
  font-weight: 300; letter-spacing: 0.18em; margin-right: -0.18em; line-height: 1; color: var(--yazi); white-space: nowrap;
  text-shadow: 0 1px 0 rgba(255, 250, 240, 0.7), 0 -1px 0 rgba(120, 100, 80, 0.08); }

/* masaüstü Chromium: yan duvar video pencereleri, projektif matrix3d ile duvara oturtulur */
.pencere { position: absolute; left: 0; top: 0; width: 180px; height: 320px; transform-origin: 0 0; z-index: 1;
  border: 7px solid var(--mese); background: #2a2622; overflow: hidden;
  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.25), 0 6px 18px rgba(20, 18, 16, 0.12); }
.pencere video { width: 100%; height: 100%; object-fit: cover; display: block; }
/* Safari/iOS/Firefox ve dokunmatik: perspektifli dönüşüm yok. Pencere kanvasa dikey şeritlerle çizilir; altında 2B afin + kırpılmış video
   (oynatma politikası için görünür kalır, kanvas çizemezse yedek görüntüdür). Video oynamazsa poster çizilir. */
.pencere-duz { position: absolute; z-index: 1; overflow: hidden; }
.pencere-duz video { position: absolute; left: 0; top: 0; width: 166px; height: 306px; object-fit: cover; transform-origin: 0 0; display: block; }
.pencere-duz canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

/* mankenler */
.sira { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
.m { position: absolute; pointer-events: none; z-index: 1; }
.m.podyum { z-index: 0; }
.m .foto, .m .yansima, .m .dusen { position: absolute; left: 0; top: 0; width: 100%; height: 100%; display: block; }
.m .foto { z-index: 2; filter: sepia(0.06) saturate(0.95) drop-shadow(0 0 0.5px rgba(40, 30, 20, 0.25));
  transform-origin: 50% 100%; transition: transform 260ms ease; }
.m .yansima { z-index: 0; top: 100%; transform: scaleY(-1); opacity: 0.075; filter: sepia(0.06) saturate(0.9) blur(0.6px);
  -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 16%); mask-image: linear-gradient(to top, #000 0%, transparent 16%); }
.m .dusen { z-index: 0; opacity: 0.065; filter: brightness(0) blur(5px); transform-origin: 50% 100%;
  transform: skewX(-38deg) scaleY(0.2); }
.m .temas, .m .ortam { position: absolute; z-index: 1; border-radius: 50%; pointer-events: none; transition: opacity 260ms ease; }
.m .temas { background: radial-gradient(closest-side, rgba(52, 36, 22, 0.62), rgba(52, 36, 22, 0)); filter: blur(2px); }
.m .ortam { background: radial-gradient(closest-side, rgba(60, 40, 25, 0.2), rgba(60, 40, 25, 0)); filter: blur(9px); }
.m .dokun { position: absolute; z-index: 3; inset: 0 8%; background: none; border: 0; padding: 0; cursor: pointer; pointer-events: auto; border-radius: 40px; }
.sahne.dar .m .dokun { inset: 0; border-radius: 12px; }   /* ölçekli sahnede dokunma alanı mankenin tamamı */
.m .dokun:focus-visible { outline: 2px solid var(--koyu); outline-offset: 4px; }
.m:hover .foto, .m.secili .foto { transform: scale(1.02); }
.m .temas { opacity: 0.9; } .m .ortam { opacity: 0.9; }
.m:hover .temas, .m.secili .temas, .m:hover .ortam, .m.secili .ortam { opacity: 1; }

/* geçişte 60 ms arayla giriş */
.koy.giris .m { animation: gir 520ms cubic-bezier(0.2, 0.7, 0.2, 1) both; animation-delay: calc(360ms + var(--i) * 60ms); }
@keyframes gir { from { opacity: 0; translate: 0 12px; } to { opacity: 1; translate: 0 0; } }

/* podyum: gerçek çekimden yürüyen manken. Chrome/Firefox: saydam WebM; Safari/iOS: kanvasta kare dizisi.
   Altta her zaman son karenin sabit görüntüsü durur; manken hiçbir anda kaybolmaz. */
.m.podyum video, .m.podyum canvas, .m.podyum img.sabit { position: absolute; display: block; z-index: 2; pointer-events: none;
  filter: sepia(0.06) saturate(0.95); }
.m.podyum img.sabit.gizli, .m.podyum video.gizli { visibility: hidden; }
.koy.hazirlik .m { opacity: 0; }
.m.podyum .temas, .m.podyum .ortam { transition: none; }

/* ürün kartı (toptan) */
.kart { position: absolute; z-index: 30; width: min(318px, calc(100vw - 32px)); display: flex; gap: 12px; padding: 12px;
  background: var(--beyaz); border-radius: 14px; box-shadow: 0 18px 44px rgba(20, 18, 16, 0.22); color: inherit; }
.kart .gorsel { width: 76px; height: 112px; flex: none; border-radius: 8px; background: #EEEBE6; overflow: hidden; position: relative; }
.kart .gorsel img { position: absolute; left: 50%; top: 6px; height: 210%; transform: translateX(-50%); }
.kart .bilgi { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.kart .kod { font-size: 0.64rem; letter-spacing: 0.14em; color: var(--is); text-transform: uppercase; }
.kart .ad { font-size: 0.86rem; line-height: 1.28; font-weight: 500; }
.kart .seri { font-size: 0.72rem; color: #5a524a; }
.kart .fiyat { font-size: 0.8rem; font-variant-numeric: tabular-nums; color: #2e2924; font-weight: 500; }
.kart .fiyat small { font-weight: 400; color: #6a6159; font-size: 0.68rem; }
.kart .stok { font-size: 0.7rem; color: #3f6b46; display: flex; align-items: center; gap: 5px; }
.kart .stok::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.kart .stok.on { color: #8a6a2c; }
.kart .eylem { display: flex; gap: 6px; margin-top: 6px; }
.kart .eylem a { font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 500; text-decoration: none;
  padding: 8px 10px; border-radius: 999px; white-space: nowrap; }
.kart .eylem .ana { background: var(--koyu); color: var(--beyaz); }
.kart .eylem .ikincil { color: var(--koyu); box-shadow: inset 0 0 0 1px rgba(20, 18, 16, 0.22); }
.kart .eylem a:focus-visible { outline: 2px solid var(--koyu); outline-offset: 2px; }
.kart .kapat { position: absolute; right: 6px; top: 6px; width: 28px; height: 28px; border: 0; background: none; cursor: pointer;
  color: #8b8178; font-size: 18px; line-height: 1; border-radius: 50%; }

.ust { position: absolute; z-index: 40; left: 0; right: 0; top: calc(14px + env(safe-area-inset-top, 0px));
  display: flex; justify-content: space-between; align-items: center; padding-inline: max(16px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.logo { font-size: 0.72rem; font-weight: 500; letter-spacing: 0.42em; color: var(--koyu); }
.ipucu { font-size: 0.64rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--is); }

.sekmeler { position: absolute; z-index: 40; left: 50%; transform: translateX(-50%);
  bottom: calc(18px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 4px; padding: 5px; max-width: calc(100% - 32px); overflow-x: auto; scrollbar-width: none;
  background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(10px); border-radius: 999px; box-shadow: 0 8px 26px rgba(20, 18, 16, 0.14); }
.sekmeler::-webkit-scrollbar { display: none; }
.sekme { flex: none; font-family: var(--govde); font-size: 0.76rem; font-weight: 500; padding: 9px 15px; border-radius: 999px;
  border: 0; background: transparent; color: #4a443e; cursor: pointer; transition: background 200ms ease, color 200ms ease; white-space: nowrap; }
.sekme:hover { background: rgba(20, 18, 16, 0.06); }
.sekme[aria-selected="true"] { background: var(--koyu); color: var(--beyaz); }
.sekme:focus-visible { outline: 2px solid var(--koyu); outline-offset: 2px; }
.sahne.dar .ipucu { display: none; }

@media (prefers-reduced-motion: reduce) {
  .ray { transition: none; } .sahne.kayiyor .ray { animation: none; } .koy.giris .m { animation: none; }
}

/* ---------- v12 ---------- */
html { overscroll-behavior: none; -webkit-text-size-adjust: 100%; }
body { overflow: hidden; }
button { font-family: inherit; color: inherit; }
.sahne { max-height: none; }
.pencere, .pencere-duz { cursor: pointer; -webkit-tap-highlight-color: transparent; }
.pencere:focus-visible, .pencere-duz:focus-visible { outline: 2px solid var(--koyu); outline-offset: 2px; }
.m .etiket { display: none; }
@media (pointer: coarse) {
  /* dokunmatik: akıcılık için yansıma ve düşen gölge yok; iki katlı temas gölgesi ve renk eşitleme kalır */
  .m .yansima, .m .dusen { display: none; }
  .m .foto { filter: sepia(0.06) saturate(0.95); }
  .sekmeler { backdrop-filter: none; background: rgba(255, 255, 255, 0.97); }
  .sekme { min-height: 44px; }
  .koy::after { display: none; }
}

/* üst: logo, kısa tanım, tüm modeller */
.logo { pointer-events: auto; text-decoration: none; display: block; }
.ust-sol { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.tanim { display: none; font-size: 12px; color: #5f564d; white-space: nowrap; }
.ust-sag { display: flex; align-items: center; gap: 14px; pointer-events: auto; }
.liste-ac { min-height: 40px; padding: 0 16px; border: 0; border-radius: 999px; background: rgba(255, 255, 255, 0.94); cursor: pointer;
  font-size: 13px; font-weight: 500; color: var(--koyu); box-shadow: inset 0 0 0 1px rgba(20, 18, 16, 0.16); white-space: nowrap; -webkit-tap-highlight-color: transparent; }
.liste-ac:hover { background: #fff; box-shadow: inset 0 0 0 1px rgba(20, 18, 16, 0.4); }
.liste-ac:focus-visible { outline: 2px solid var(--koyu); outline-offset: 2px; }

/* telefon dikey: üst, oda, kontrol satırı, sekmeler. Sayfa kaymaz; mankenler odada yatay sayfalarla geçer */
.tel-sahne, .tel-alt { display: none; }
.sahne.tel { display: grid; grid-template-rows: auto minmax(0, 1fr) auto auto; background: #F4F1EC; }
.sahne.tel .kutu, .sahne.tel .zemin-dolgu { display: none; }

.sahne.tel .logo { font-size: 13px; letter-spacing: 0.32em; padding: 14px 0; margin: -14px 0; position: relative; z-index: 1; }
.sahne.tel .tanim { display: block; }
.sahne.tel .ipucu { display: none; }
.sahne.tel .liste-ac { min-height: 44px; padding: 0 14px; }
.sahne.tel .tel-sahne { display: block; position: relative; min-height: 0; overflow: hidden; background: var(--tavan); }
.tel-oda { position: absolute; inset: 0; }
.tel-oda svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.tel-bas { position: absolute; left: 0; right: 0; top: 0; z-index: 3; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 8px; padding: 0 calc(6.5% + 6px); pointer-events: none; }
.tel-baslik { text-align: center; font-weight: 300; letter-spacing: 0.12em; margin-right: -0.12em; line-height: 1.14; color: var(--yazi); text-shadow: 0 1px 0 rgba(255, 250, 240, 0.7); }
.tel-baslik.gecis { animation: bas 320ms ease both; }
@keyframes bas { from { opacity: 0; } to { opacity: 1; } }
.tv { position: relative; padding: 0; border: 3px solid var(--mese); background: #2a2622; overflow: hidden; pointer-events: auto; cursor: pointer; display: block; border-radius: 1px;
  box-shadow: 0 3px 10px rgba(20, 18, 16, 0.14); -webkit-tap-highlight-color: transparent; }
.tv::before { content: ""; position: absolute; left: 50%; top: 50%; width: 44px; height: 44px; transform: translate(-50%, -50%); }
.tv video { width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
.tv:focus-visible { outline: 2px solid var(--koyu); outline-offset: 2px; }
.tel-ray { position: absolute; inset: 0; z-index: 2; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; overscroll-behavior-x: contain;
  scrollbar-width: none; touch-action: pan-x pinch-zoom; -webkit-overflow-scrolling: touch; }
.tel-ray::-webkit-scrollbar { display: none; }
.tel-sayfa { position: relative; flex: none; height: 100%; scroll-snap-align: center; scroll-snap-stop: always; pointer-events: none; }
.sahne.tel .m .dokun { inset: 0; border-radius: 14px; }
.sahne.tel .m .etiket { display: block; position: absolute; left: 50%; top: calc(100% + 9px); transform: translateX(-50%); width: max(100%, 104px); text-align: center; pointer-events: none; z-index: 4; line-height: 1.22; white-space: nowrap; }
.etiket b { display: block; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; color: #231E19; }
.etiket i { display: block; font-style: normal; font-size: 12px; font-variant-numeric: tabular-nums; color: #51483f; }

.ok { width: 48px; height: 48px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; color: var(--koyu); -webkit-tap-highlight-color: transparent; }
.ok[disabled] { color: rgba(20, 18, 16, 0.22); cursor: default; }

.ok:focus-visible { outline: 2px solid var(--koyu); outline-offset: -6px; border-radius: 12px; }
.tel-durum { text-align: center; line-height: 1.26; min-width: 0; }

.sahne.tel .sekmeler { position: relative; left: auto; bottom: auto; transform: none; max-width: none; width: 100%; border-radius: 0; box-shadow: none; background: #fff; gap: 2px;
  padding: 3px 8px calc(3px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid rgba(60, 45, 30, 0.1); backdrop-filter: none; }
.sahne.tel .sekme { font-size: 14px; padding: 0 14px; min-height: 44px; }

/* telefon yatay: sekmeler üstte, ayaklar serbest */
.sahne.yatay .ipucu, .sahne.yatay .tanim { display: none; }
.sahne.yatay .ust { top: calc(2px + env(safe-area-inset-top, 0px)); padding-right: max(10px, env(safe-area-inset-right, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px)); }

.sahne.yatay .sekmeler { top: calc(2px + env(safe-area-inset-top, 0px)); bottom: auto; padding: 0 4px; max-width: calc(100% - 290px); box-shadow: 0 3px 12px rgba(20, 18, 16, 0.1); }

.kart { display: block; width: 372px; padding: 14px 16px 16px; z-index: 60; max-height: calc(100% - 24px); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }

const TL = n => n.toLocaleString("tr-TR", { maximumFractionDigits: 0 });
const UA = navigator.userAgent;
const IOS = /iP(hone|ad|od)/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
// Safari/iOS saydam VP9 WebM oynatamaz: orada podyum kanvasta kare dizisiyle yürür
// Kanvas kare dizisi: Safari, VP9 alfası olmayan motorlar ve tüm telefon/tablet/dar ekran. Codec ve otomatik oynatma politikasından bağımsız.

// Tek noktalı perspektif oda. viewBox 1000x600; arka duvar 150..850 x 60..430.

    '<defs>' +
      '<linearGradient id="' + id("arka") + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7F5F1"/><stop offset="0.86" stop-color="#EEEBE5"/><stop offset="1" stop-color="#E6E2DB"/></linearGradient>' +
      '<radialGradient id="' + id("spot") + '" cx="0.5" cy="0" r="0.75"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.85"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>' +
      '<linearGradient id="' + id("zemin") + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#D9D4CC"/><stop offset="1" stop-color="#C9C2B7"/></linearGradient>' +
      '<linearGradient id="' + id("ao") + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A4632" stop-opacity="0.16"/><stop offset="1" stop-color="#5A4632" stop-opacity="0"/></linearGradient>' +
      '<linearGradient id="' + id("aoD") + '" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#5A4632" stop-opacity="0.07"/><stop offset="1" stop-color="#5A4632" stop-opacity="0"/></linearGradient>' +
      '<filter id="' + id("doku") + '" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.75 1.6" numOctaves="3" seed="' + (7 + n) + '"/>' +
        '<feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.29  0 0 0 0 0.22  0 0 0 0.55 0"/></filter>' +
      '<clipPath id="' + id("zk") + '"><polygon points="150,430 850,430 1000,600 0,600"/></clipPath>' +
    '</defs>' +
    '<polygon points="0,0 1000,0 850,60 150,60" fill="#E9E6E0"/>' +
    '<polygon points="330,8 670,8 640,40 360,40" fill="#FFFFFF" opacity="0.75"/>' +
    '<rect x="150" y="60" width="700" height="370" fill="url(#' + id("arka") + ')"/>' +

    '<rect x="150" y="408" width="700" height="22" fill="url(#' + id("aoD") + ')"/>' +
    '<polygon points="0,0 150,60 150,430 0,600" fill="#E3DFD8"/>' +
    '<polygon points="1000,0 850,60 850,430 1000,600" fill="#E3DFD8"/>' +
    '<polygon points="150,430 850,430 1000,600 0,600" fill="url(#' + id("zemin") + ')"/>' +
    '<g clip-path="url(#' + id("zk") + ')"><rect x="0" y="430" width="1000" height="170" filter="url(#' + id("doku") + ')" opacity="0.32"/></g>' +
    '<polygon points="150,430 850,430 868,452 132,452" fill="url(#' + id("ao") + ')"/>' +
    '<polygon points="150,426 850,426 850,430 150,430" fill="#DCD6CD"/>' +
    '<line x1="150" y1="60" x2="150" y2="430" stroke="#D3CEC6" stroke-width="2"/>' +
    '<line x1="850" y1="60" x2="850" y2="430" stroke="#D3CEC6" stroke-width="2"/>' +
  '</svg>';
}

// Yan duvar pencerelerinin köşeleri (viewBox birimiyle): sol üst, sağ üst, sol alt, sağ alt
const PENCERE = [
  [[22, 133.4], [128, 140.0], [22, 473.2], [128, 382.2]],
  [[872, 140.0], [978, 133.4], [872, 382.2], [978, 473.2]]
];
function adj(m) { return [m[4]*m[8]-m[5]*m[7], m[2]*m[7]-m[1]*m[8], m[1]*m[5]-m[2]*m[4], m[5]*m[6]-m[3]*m[8], m[0]*m[8]-m[2]*m[6], m[2]*m[3]-m[0]*m[5], m[3]*m[7]-m[4]*m[6], m[1]*m[6]-m[0]*m[7], m[0]*m[4]-m[1]*m[3]]; }
function mm(a, b) { const c = []; for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) { let s = 0; for (let k = 0; k < 3; k++) s += a[3*i+k] * b[3*k+j]; c[3*i+j] = s; } return c; }
function mv(m, v) { return [m[0]*v[0]+m[1]*v[1]+m[2]*v[2], m[3]*v[0]+m[4]*v[1]+m[5]*v[2], m[6]*v[0]+m[7]*v[1]+m[8]*v[2]]; }
function taban(p) { const m = [p[0][0], p[1][0], p[2][0], p[0][1], p[1][1], p[2][1], 1, 1, 1]; const v = mv(adj(m), [p[3][0], p[3][1], 1]); return mm(m, [v[0], 0, 0, 0, v[1], 0, 0, 0, v[2]]); }
function homografi(w, h, hedef) {
  const s = taban([[0, 0], [w, 0], [0, h], [w, h]]), d = taban(hedef), t = mm(d, adj(s));
  for (let i = 0; i < 9; i++) t[i] = t[i] / t[8];
  return t;
}
function matris(w, h, hedef) {
  const t = homografi(w, h, hedef);
  return "matrix3d(" + [t[0], t[3], 0, t[6], t[1], t[4], 0, t[7], 0, 0, 1, 0, t[2], t[5], 0, t[8]].join(",") + ")";
}
const esle = (t, u, v) => { const z = t[6] * u + t[7] * v + t[8]; return [(t[0] * u + t[1] * v + t[2]) / z, (t[3] * u + t[4] * v + t[5]) / z]; };

const CERCEVE_O = 0.40, CERCEVE_O_TEL = 0.62;   // hucre genisligi / manken boyu
function ogeEl(s, i) { return s.startsWith("P:") ? podyumEl(s.slice(2), i) : s.startsWith("F:") ? cerceveEl(s.slice(2), i) : mankenEl(s, i); }
function ogeOran(el) { return el.dataset.s === "F" ? (olcu && olcu.tel ? CERCEVE_O_TEL : CERCEVE_O) : el.dataset.p ? PODYUM[el.dataset.p].genislik : KESIM[el.dataset.s].o; }
// Cerceve: ust..taban arasina 2:3 oturur, etiket altinda. Degerler .m kutusunun ustune gore.
function cerceveOlcu(el, w, ust, taban) {
  const et = 44, alan = Math.max(60, taban - ust - et), h = Math.min(w * 0.94 * 1.5, alan), g = h / 1.5, cv = el.querySelector(".cv"), e = el.querySelector(".etiket");
  const t = ust + (alan - h) / 2;
  cv.style.width = g + "px"; cv.style.height = h + "px"; cv.style.left = (w - g) / 2 + "px"; cv.style.top = t + "px";
  e.style.top = t + h + 7 + "px";
}

// görselleri yükle: önce açık duvar, sonra komşular, sonra hepsi
function yukle(n) {
  const koy = ray.children[n];
  if (!koy || koy.dataset.yuklu) return;
  koy.dataset.yuklu = 1;
  koy.querySelectorAll("img[data-src]").forEach(im => { im.src = im.dataset.src; });
  koy.querySelectorAll(".pencere-duz").forEach(p => {
    const im = new Image();
    im.onload = () => { p._poster = im; pencereCiz(p); };
    im.src = "v/" + p.dataset.v + ".jpg";

  if (!DOKUNMATIK) koy.querySelectorAll(".podyum video").forEach(v => { v.preload = "auto"; });

// Ölçü. Geniş ekranda sahne olduğu gibi; dar ekranda (telefon, dikey tablet) aynı kompozisyon ODA_W×ODA_H sanal
// boyutta kurulur ve ekran genişliğine ölçeklenir. Kutunun üstü tavan, altı zemin dolgusudur.
function boyutla() {
  const SW = sahne.clientWidth, SH = sahne.clientHeight;
  const tel = (SW / SH < 1.6 && SW <= 700) || (SW / SH < 1 && SW <= 1024);   // telefon ve dikey tablet: ayrı düzen (telYerlesim)
  const yatay = !tel && SH <= 520;          // telefon yatay: sekmeler üstte
  const dar = !tel && !yatay && SW / SH < 1.6;
  sahne.classList.toggle("dar", dar);
  sahne.classList.toggle("tel", tel);
  sahne.classList.toggle("yatay", yatay);
  if (tel) { olcu = { W: SW, H: SH, s: 1, ust: 0, dar: false, tel: true, yatay: false }; telYerlesim(); return; }
  let W = SW, H = SH, s = 1, ust = 0;
  if (dar) { H = ODA_H; W = Math.max(ODA_W, Math.round(H * SW / SH)); s = SW / W; ust = Math.round((SH - H * s) * 0.34); }
  olcu = { W, H, s, ust, dar, tel: false, yatay };
  kutu.style.width = W + "px"; kutu.style.height = H + "px";
  kutu.style.transform = dar ? "translate(0," + ust + "px) scale(" + s + ")" : "none";
  // zemin dolgusu: oda SVG'sinin alt kenarındaki renk ve dokunun devamı (aynı birim ölçeğinde)
  const alt = dar ? SH - ust - H * s : 0;
  zeminDolgu.style.height = Math.max(0, Math.ceil(alt) + 1) + "px";
  zeminDolgu.style.display = alt > 0 ? "block" : "none";
  if (alt > 0) {
    const vb = 1000, vh = alt / (W * s) * 1000 * (W / H) * 0.6;   // oda viewBox'ı 1000x600'ün birimiyle
    zeminDolgu.setAttribute("viewBox", "0 0 " + vb + " " + vh);
    zeminDolgu.innerHTML = '<defs><linearGradient id="zd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C9C2B7"/><stop offset="1" stop-color="#C3BCB1"/></linearGradient>' +
      '<filter id="zdk" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.75 1.6" numOctaves="3" seed="7"/>' +
      '<feColorMatrix type="matrix" values="0 0 0 0 0.35  0 0 0 0 0.29  0 0 0 0 0.22  0 0 0 0.55 0"/></filter></defs>' +
      '<rect width="' + vb + '" height="' + vh + '" fill="url(#zd)"/><rect width="' + vb + '" height="' + vh + '" filter="url(#zdk)" opacity="0.32"/>';
  }

  const ayakY = H * (yatay ? 0.955 : 0.885);
  const boy = H * (yatay ? 0.735 : 0.62);
  ray.querySelectorAll(".koy").forEach((koy, n) => {
    koy.style.width = W + "px";
    const yazi = koy.querySelector(".duvar-yazi");
    const fs = (yatay ? Math.min(H * 0.062, 26) : Math.min(W * 0.052, H * 0.085, 84)) * (DUVAR[n].ad.length > 8 ? 0.82 : 1);
    yazi.style.fontSize = fs + "px";
    yazi.style.top = (yatay ? 54 : H * 0.118) + "px";

    const els = Array.from(koy.querySelectorAll(".m"));
    const gen = els.map(el => boy * ogeOran(el));
    const hepsiF = els.every(el => el.dataset.s === "F");   // yalnız çerçeve: arada nefes, duvardan taşmaz
    const ara = boy * (hepsiF ? 0.04 : 0.005);                              // kollar birbirine değmesin diye küçük aralık
    const toplam = gen.reduce((t, g) => t + g, 0) + ara * (els.length - 1);
    // sığmazsa tüm duvar birlikte küçülür; dizi pencerelerin arasında kalır
    const olcek = Math.min(1, W * (hepsiF ? 0.66 : yatay ? 0.76 : 0.72) / toplam);
    const b = boy * olcek;
    let x = (W - toplam * olcek) / 2;
    els.forEach((el, i) => {
      const w = gen[i] * olcek;
      el.style.left = x + "px"; el.style.top = (ayakY - b) + "px"; el.style.width = w + "px"; el.style.height = b + "px";
      if (el.dataset.s === "P") podyumOlcu(el, b);
      else if (el.dataset.s === "F") cerceveOlcu(el, w, H * 0.215 - (ayakY - b), H * 0.705 - (ayakY - b));
      else golgeYerlestir(el, KESIM[el.dataset.s].ax, KESIM[el.dataset.s].aw, w, b);
      x += (gen[i] + ara) * olcek;
    });

    koy.querySelectorAll(".pencere").forEach((p, i) => {
      p.style.transform = matris(180, 320, PENCERE[i].map(([px, py]) => [px / 1000 * W, py / 600 * H]));
    });
    koy.querySelectorAll(".pencere-duz").forEach((p, i) => pencereDuzOlcu(p, PENCERE[i].map(([px, py]) => [px / 1000 * W, py / 600 * H])));
  });
}

// Dokunmatik pencere: kutu = dörtgenin sınır kutusu, dörtgene kırpılır. Video 2B afin (üç köşe) ile yerleşir;
// kanvas dış çerçeveyi ve içi gerçek perspektifle (dikey şeritler) çizer.
function pencereDuzOlcu(p, k) {
  const x0 = Math.min(k[0][0], k[2][0]), x1 = Math.max(k[1][0], k[3][0]);
  const y0 = Math.min(k[0][1], k[1][1]), y1 = Math.max(k[2][1], k[3][1]);
  const bw = x1 - x0, bh = y1 - y0;
  p.style.left = x0 + "px"; p.style.top = y0 + "px"; p.style.width = bw + "px"; p.style.height = bh + "px";
  const yerel = k.map(([x, y]) => [x - x0, y - y0]);
  p.style.clipPath = "polygon(" + [yerel[0], yerel[1], yerel[3], yerel[2]].map(([x, y]) => x.toFixed(2) + "px " + y.toFixed(2) + "px").join(",") + ")";
  const t = homografi(180, 320, yerel);
  p._t = t; p._bw = bw; p._bh = bh;
  const a = esle(t, 7, 7), bR = esle(t, 173, 7), c = esle(t, 7, 313);
  p.querySelector("video").style.transform = "matrix(" + [(bR[0] - a[0]) / 166, (bR[1] - a[1]) / 166, (c[0] - a[0]) / 306, (c[1] - a[1]) / 306, a[0], a[1]].map(z => z.toFixed(5)).join(",") + ")";
  const cv = p.querySelector("canvas");
  const dpr = Math.min(3, window.devicePixelRatio || 1);
  cv.width = Math.max(2, Math.round(bw * olcu.s * dpr)); cv.height = Math.max(2, Math.round(bh * olcu.s * dpr));
  pencereCiz(p);
}
let araKanvas = null;
function pencereCiz(p) {
  const t = p._t; if (!t) return;
  const cv = p.querySelector("canvas"), ctx = cv.getContext("2d"), v = p.querySelector("video");
  const q = cv.width / p._bw;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(q, 0, 0, q, 0, 0);

  const yedegeGec = () => { if (!yedek) { yedek = true; v.src = "v/t/" + ad + ".mp4"; v.load(); oynat(); return true; } return false; };
  v.addEventListener("error", () => { if (p._kapali) return; if (!yedegeGec()) dur("hata"); });
  p.querySelector(".vpano-kap").addEventListener("click", () => { if (p.dataset.durum === "hata") return; if (v.paused) oynat(); else v.pause(); });
  // 6 sn icinde baslamazsa hafif surum denenir (yavas ag, sessiz kalan hata); 12 sn sonunda dokun ya da uyari
  p._zaman = setTimeout(() => {
    if (v.readyState >= 2) { if (v.paused) dur("dokun"); return; }
    yedegeGec();
    p._zaman = setTimeout(() => { if (v.readyState < 2) dur(v.error || v.networkState === 3 ? "hata" : "dokun"); else if (v.paused) dur("dokun"); }, 6000);
  }, 6000);
  oynat();
}

});

sonW = sahne.clientWidth; sonH = sahne.clientHeight;
ray.querySelectorAll(".koy").forEach((k, i) => k.querySelectorAll(".dokun").forEach(b => { b.tabIndex = i === 0 ? 0 : -1; }));

(function () {

if (olcu.tel) {

  (function ilkAcilis() {

    const t0 = performance.now();

      else setTimeout(bak, 60);

  addEventListener("load", () => {
