<style>
/* Tam ekran gerçek çekim düzeni. Kesim, sahte oda, gölge ve yansıma yok. Renkler kechiwoman.com paleti.
   Kart, Tüm modeller, tam ekran video ve geri tuşu v13.2'den alındı (aşağıdaki "canlıdan" bölümü). */
:root {
  --bg: #f7f4ef;
  --bg-sessiz: #efe9e1;
  --cizgi: #e4dbd0;
  --koyu: #1d1714;
  --is: #5f554d;
  --marka: #5b3a2e;
  --marka-acik: #cdbfb0;
  --sessiz: #5f554d;
  --beyaz: #ffffff;
  --plaka: rgba(29, 23, 20, 0.74);
  --bant: calc(52px + env(safe-area-inset-top, 0px));
  --sekme: 0px;
  --ray: 190px;
  --govde: "Outfit", ui-sans-serif, system-ui, sans-serif;
  --baslik: "Playfair Display", ui-serif, Georgia, serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html { scroll-snap-type: y mandatory; scroll-padding-top: var(--bant); scroll-behavior: smooth; }
html, body { margin: 0; padding: 0; }
body { background: var(--koyu); color: var(--koyu); font-family: var(--govde); -webkit-font-smoothing: antialiased; overflow-x: clip; }
a { color: inherit; text-decoration: none; }

.bant { position: fixed; z-index: 30; inset: 0 0 auto 0; height: var(--bant); padding-top: env(safe-area-inset-top, 0px);
  padding-inline: max(20px, env(safe-area-inset-left, 0px)) max(20px, env(safe-area-inset-right, 0px));
  display: flex; align-items: center; gap: 16px; background: var(--koyu); color: var(--beyaz); }
.logo { display: inline-flex; align-items: center; min-height: 44px; font-size: 15px; font-weight: 500; letter-spacing: 0.3em; white-space: nowrap; touch-action: manipulation; }
.bant h1 { margin: 0 auto; font-size: 14px; font-weight: 400; letter-spacing: 0.02em; color: #f7f4ef; text-align: center; }
.liste-ac { flex: none; min-height: 36px; padding: 0 14px; border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 2px; background: none; color: #fff;
  font: 400 13px var(--govde); cursor: pointer; white-space: nowrap; touch-action: manipulation; }
.liste-ac:hover { background: #fff; color: var(--koyu); }
@media (pointer: coarse) { .liste-ac { min-height: 44px; } }

.ray { position: fixed; z-index: 20; left: 0; top: var(--bant); bottom: 0; width: var(--ray); background: var(--bg); border-right: 1px solid var(--cizgi);
  display: flex; flex-direction: column; gap: 2px; padding: 28px 12px; }
.ray a { display: flex; align-items: center; min-height: 44px; padding: 0 12px; font-size: 15px; color: var(--koyu); border-radius: 4px; touch-action: manipulation; }
.ray a:hover { background: var(--bg-sessiz); }
.ray a[aria-current="true"] { background: var(--marka); color: var(--beyaz); }
.ray-alt { margin-top: auto; padding: 0 12px; font-size: 12px; line-height: 1.5; color: var(--sessiz); }

main { margin-left: var(--ray); padding-top: var(--bant); padding-bottom: var(--sekme); }
.bolum { position: relative; height: calc(100vh - var(--bant) - var(--sekme)); height: calc(100dvh - var(--bant) - var(--sekme)); min-height: 300px; overflow: hidden;
  scroll-snap-align: start; scroll-snap-stop: always; background: var(--koyu); }
.medyalar { position: absolute; inset: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; background: var(--koyu); }
.kare { position: relative; overflow: hidden; background: #2b2320; min-width: 0; }
.kare img, .kare video { display: block; width: 100%; height: 100%; object-fit: cover;
  object-position: var(--x, 50%) var(--y, 50%); transform: scale(var(--z, 1)); transform-origin: var(--x, 50%) var(--y, 50%); }
.dokun { position: absolute; inset: 0; z-index: 1; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
.dokun:focus-visible { outline: 2px solid #fff; outline-offset: -4px; }
.etk { position: absolute; z-index: 2; left: 12px; top: 12px; padding: 6px 10px; background: var(--plaka); color: #fff; font-size: 13px; line-height: 1.25; pointer-events: none; border-radius: 2px; white-space: nowrap; }
.etk b { font-weight: 500; }
.izle { position: absolute; z-index: 3; right: 12px; bottom: 12px; display: grid; place-items: center; width: 48px; height: 48px; padding: 0; border: 0; border-radius: 50%;
  background: rgba(255, 255, 255, 0.92); color: #171310; cursor: pointer; touch-action: manipulation; }
.izle svg { width: 24px; height: 24px; display: block; }

.yazi { position: absolute; z-index: 2; left: 50%; top: 12px; transform: translateX(-50%); min-width: 300px; max-width: calc(100% - 24px);
  padding: 10px 26px 14px; background: var(--plaka); color: var(--beyaz); text-align: center; border-radius: 2px; }
.yazi h2 { margin: 0; font-family: var(--baslik); font-weight: 400; font-size: 36px; line-height: 1.1; letter-spacing: 0.08em; margin-right: -0.08em; text-transform: uppercase; white-space: nowrap; }
.yazi p { margin: 3px 0 0; font-size: 14px; font-weight: 300; color: #f7f4ef; white-space: nowrap; }
.yazi p.fy { font-weight: 400; margin: 1px 0 8px; }
.incele { display: inline-flex; align-items: center; min-height: 44px; padding: 0 28px; border: 1px solid var(--beyaz); color: var(--beyaz);
  font-size: 13px; font-weight: 500; letter-spacing: 0.14em; touch-action: manipulation; }
.incele:hover { background: var(--beyaz); color: var(--koyu); }
a:focus-visible, button:focus-visible { outline: 2px solid var(--marka-acik); outline-offset: 2px; }

/* telefon dikey ve dikey tablet: tek tam ekran medya, altta v13 sekmeleri */
.sekmeler { display: none; }
@media (max-width: 800px), (orientation: portrait) and (max-width: 1100px) {
  :root { --bant: calc(72px + env(safe-area-inset-top, 0px)); --sekme: calc(50px + env(safe-area-inset-bottom, 0px)); }
  .bant { flex-wrap: wrap; align-content: center; gap: 0 12px; padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(10px, env(safe-area-inset-right, 0px)); }
  .logo { flex: 1 1 auto; font-size: 14px; }
  .liste-ac { min-height: 44px; }
  .bant h1 { order: 3; flex: 1 0 100%; margin: -6px 0 0; padding-bottom: 5px; font-size: 12.5px; font-weight: 300; text-align: left; white-space: nowrap; }
  .ray { display: none; }
  main { margin-left: 0; }
  .medyalar { grid-template-columns: 1fr; }
  .kare:not(.tel) { display: none; }
  .kare img, .kare video { object-position: var(--tx, 50%) var(--ty, 50%); transform: scale(var(--tz, 1)); transform-origin: var(--tx, 50%) var(--ty, 50%); }
  .etk { display: none; }
  .yazi { top: 12px; min-width: 250px; padding: 12px 22px 14px; }
  .yazi h2 { font-size: 30px; }
  .yazi p.ac { display: none; }
  .yazi p.fy { margin: 3px 0 9px; font-size: 13px; }
  .sekmeler { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; height: var(--sekme); padding: 3px 8px env(safe-area-inset-bottom, 0px);
    display: flex; gap: 2px; overflow-x: auto; overscroll-behavior-x: contain; scrollbar-width: none; background: #fff; border-top: 1px solid var(--cizgi); }
  .sekmeler::-webkit-scrollbar { display: none; }
  .sekme { flex: none; display: inline-flex; align-items: center; min-height: 44px; padding: 0 14px; border-radius: 999px; font-size: 14px; font-weight: 500; color: #3c352f; touch-action: manipulation; }
  .sekme[aria-current="true"] { background: var(--koyu); color: #fff; }
}
/* kısa telefon ekranı (Safari adres çubuğu açık, 390x664): baş ve ayak kesilmesin diye kırpma yok, plaka küçülür */
@media (max-width: 800px) and (max-height: 740px) and (orientation: portrait) {
  .kare img, .kare video { object-fit: contain; transform: none; }
  .yazi { top: 8px; padding: 8px 18px 10px; min-width: 230px; }
  .yazi h2 { font-size: 24px; }
  .yazi p.fy { margin: 2px 0 6px; font-size: 12.5px; }
}
/* telefon yatay: üç medya kırpılmadan, plaka solda */
@media (orientation: landscape) and (max-height: 520px) {
  :root { --bant: calc(40px + env(safe-area-inset-top, 0px)); --sekme: 0px; --ray: 0px; }
  html { scroll-snap-type: y proximity; }
  .ray { display: none; }
  main { margin-left: 0; }
  .sekmeler { display: none; }
  .bant h1 { font-size: 12.5px; }
  .bolum { display: grid; grid-template-columns: 210px 1fr; padding-inline: env(safe-area-inset-left, 0px) env(safe-area-inset-right, 0px); }
  .medyalar { position: relative; grid-column: 2; grid-row: 1; }
  .kare img, .kare video { object-fit: contain; transform: none; }
  .etk { display: none; }
  .yazi { position: relative; grid-column: 1; grid-row: 1; left: 0; top: 0; transform: none; min-width: 0; max-width: none; align-self: center; padding: 12px 10px; background: none; }
  .yazi h2 { font-size: 24px; white-space: normal; }
  .yazi p { white-space: normal; font-size: 13px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

/* ----- canlıdan (v13.2): ürün kartı, Tüm modeller, tam ekran video ----- */

  background: var(--beyaz); border-radius: 14px; box-shadow: 0 18px 44px rgba(20, 18, 16, 0.22); color: inherit; }
.kart .gorsel { width: 76px; height: 112px; flex: none; border-radius: 8px; background: #EEEBE6; overflow: hidden; position: relative; }
.kart .gorsel img { position: absolute; left: 50%; top: 6px; height: 210%; transform: translateX(-50%); }
.kart .bilgi { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.kart .kod { font-size: 0.64rem; letter-spacing: 0.14em; color: var(--is); text-transform: uppercase; }

  padding: 8px 10px; border-radius: 999px; white-space: nowrap; }
.kart .eylem .ana { background: var(--koyu); color: var(--beyaz); }
.kart .eylem .ikincil { color: var(--koyu); box-shadow: inset 0 0 0 1px rgba(20, 18, 16, 0.22); }
.kart .eylem a:focus-visible { outline: 2px solid var(--koyu); outline-offset: 2px; }
.kart .kapat { position: absolute; right: 6px; top: 6px; width: 28px; height: 28px; border: 0; background: none; cursor: pointer;
  color: #8b8178; font-size: 18px; line-height: 1; border-radius: 50%; }
@keyframes bas { from { opacity: 0; } to { opacity: 1; } }
/* ürün kartı v12 */
.perde { position: fixed; inset: 0; z-index: 55; background: rgba(20, 18, 16, 0.42); animation: bas 180ms ease both; }
.kart { display: block; width: 372px; padding: 14px 16px 16px; z-index: 60; max-height: calc(100% - 24px); overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
.kart-ust { position: sticky; top: 0; z-index: 3; height: 0; margin: 0 -16px; }
.kart .tut { display: none; }
.kart .gal { display: flex; gap: 8px; height: 216px; margin: 0 -16px 12px; padding: 0 16px; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scroll-padding-inline: 16px; scrollbar-width: none; }
.kart .gal::-webkit-scrollbar { display: none; }
.kart .gal img { flex: none; height: 100%; width: auto; aspect-ratio: 3 / 4; object-fit: contain; object-position: 50% 50%; background: #EEEBE6; border-radius: 10px; scroll-snap-align: start; display: block; }
.kart .gal img.kesim { padding: 8px 0; }
.kart .bilgi { display: flex; flex-direction: column; gap: 5px; padding-right: 0; }

.kart .fiyat { font-size: 16px; font-weight: 500; }
.kart .fiyat small { display: block; font-size: 13px; font-weight: 400; color: #51483f; margin-top: 2px; }

.kart .renkler { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }

.kart .renkler a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 12px; border-radius: 999px; font-size: 13px; color: var(--koyu); text-decoration: none; box-shadow: inset 0 0 0 1px rgba(20, 18, 16, 0.2); }

.kart .kapat { width: 44px; height: 44px; right: 2px; top: 2px; position: absolute; background: rgba(255, 255, 255, 0.88); font-size: 24px; color: #2e2924; }
.kart .kapat:focus-visible { outline: 2px solid var(--koyu); outline-offset: -3px; }
.kart.alt { position: fixed; left: 0; right: 0; bottom: 0; top: auto !important; width: auto; max-width: 560px; margin-inline: auto; max-height: calc(100dvh - 32px); border-radius: 18px 18px 0 0; padding: 0 16px; box-shadow: 0 -12px 40px rgba(20, 18, 16, 0.22); animation: yukari 260ms cubic-bezier(0.2, 0.7, 0.2, 1) both; }

    display: grid; grid-template-columns: 148px minmax(0, 1fr); column-gap: 12px; align-content: start; }

@keyframes yandan { from { transform: translateX(40px); opacity: 0.4; } to { transform: none; opacity: 1; } }

.liste-ust { flex: none; display: grid; grid-template-columns: minmax(0, 1fr) 48px; align-items: center; padding: calc(8px + env(safe-area-inset-top, 0px)) max(8px, env(safe-area-inset-right, 0px)) 2px max(16px, env(safe-area-inset-left, 0px)); }
.liste-ust h1 { margin: 0; font-size: 18px; font-weight: 500; }
.liste-ust p { margin: 2px 0 0; font-size: 13px; line-height: 1.3; color: #51483f; }
.liste-kapat { width: 48px; height: 48px; border: 0; background: none; font-size: 28px; line-height: 1; cursor: pointer; color: var(--koyu); }
.liste-suz { flex: none; display: flex; gap: 6px; overflow-x: auto; padding: 8px max(16px, env(safe-area-inset-left, 0px)); scrollbar-width: none; border-bottom: 1px solid rgba(60, 45, 30, 0.12); }
.liste-suz::-webkit-scrollbar { display: none; }
.liste-suz button { flex: none; min-height: 44px; padding: 0 14px; border: 0; border-radius: 999px; background: #fff; font-size: 14px; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(20, 18, 16, 0.14); color: #3c352f; }
.liste-suz button[aria-pressed="true"] { background: var(--koyu); color: #fff; box-shadow: none; }
.liste-govde { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 12px max(12px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); }
.liste-izgara { display: grid; grid-template-columns: repeat(auto-fill, minmax(164px, 1fr)); gap: 10px; max-width: 1280px; margin: 0 auto; }
.lu { display: flex; flex-direction: column; padding: 0 0 12px; border: 0; background: #fff; border-radius: 12px; text-align: left; cursor: pointer; overflow: hidden; box-shadow: 0 0 0 1px rgba(60, 45, 30, 0.08); -webkit-tap-highlight-color: transparent; }
.lu:hover { box-shadow: 0 0 0 1px rgba(60, 45, 30, 0.32); }

.liste-son { max-width: 1280px; margin: 18px auto 0; display: flex; flex-wrap: wrap; gap: 8px; }

/* gerçek video */
.vpano { position: fixed; inset: 0; z-index: 70; background: #14110E; display: flex; flex-direction: column; animation: bas 180ms ease both; }
.vpano-kap { flex: 1; min-height: 0; position: relative; }
.vpano video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; display: block; }
video::-webkit-media-controls-start-playback-button, video::-webkit-media-controls { display: none !important; -webkit-appearance: none; }
.vpano-oynat { display: none; position: absolute; left: 50%; top: 50%; width: 72px; height: 72px; margin: -36px 0 0 -36px; border: 0; border-radius: 50%; background: rgba(255, 255, 255, 0.92); color: #171310; place-items: center; cursor: pointer; }
.vpano[data-durum="dokun"] .vpano-oynat { display: grid; }
.vpano-yuk { display: none; position: absolute; left: 50%; top: 50%; width: 38px; height: 38px; margin: -19px 0 0 -19px; border: 3px solid rgba(255, 255, 255, 0.35); border-top-color: #fff; border-radius: 50%; animation: don 0.9s linear infinite; }

    '<a class="incele" target="_blank" rel="noopener" href="' + b.url + '" aria-label="' + b.ad.replace("&", "ve") + ' kategorisini incele">İNCELE</a>';
  y.querySelector("h2").textContent = b.ad; y.querySelector(".ac").textContent = b.alt;
  s.append(g, y); icerik.append(s);
  for (const [kok, sinif] of [[ray, ""], [sekmeler, "sekme"]]) { const l = document.createElement("a"); l.href = "#" + b.id; l.textContent = b.ad; if (sinif) l.className = sinif; kok.append(l); }
});
const notEl = document.createElement("div"); notEl.className = "ray-alt"; notEl.textContent = "Fiyatlar KDV hariç · 6'lı seri"; ray.append(notEl);

// Yalnız açık bölümün videosu yüklenir ve oynar; bölümden çıkınca kaynak bırakılır (Android çözücü sınırı). Oynamazsa kapak kalır.
function kaynak(v) { return v.dataset.yol.replace("v/", TEL_DUZEN.matches || DOKUNMATIK ? "v/s/" : "v/") + ".mp4"; }
function guncelle(yeniden) {
  document.querySelectorAll(".bolum").forEach(s => {
    const ac = +s.dataset.i === aktif && !vPano && !document.hidden;
    s.querySelectorAll("video").forEach(v => {
      if (ac && OYNAT && v.offsetParent) {
        if (!v.getAttribute("src")) { v.src = kaynak(v); v.load(); }
        else if (yeniden && !v.loop) v.currentTime = 0;
        if (v.loop || yeniden || !v.ended) { const q = v.play(); if (q) q.catch(() => {}); }
      } else { v.pause(); if (+s.dataset.i !== aktif && v.getAttribute("src")) { v.removeAttribute("src"); delete v.dataset.yedek; v.load(); } }
    });
  });
}
const raySek = [...ray.querySelectorAll("a[href^='#']")], telSek = [...sekmeler.children];
function isaretle(n) {
  [raySek, telSek].forEach(L => L.forEach((l, i) => i === n ? l.setAttribute("aria-current", "true") : l.removeAttribute("aria-current")));
  const t = telSek[n]; if (t && sekmeler.offsetParent !== null) sekmeler.scrollTo({ left: t.offsetLeft - (sekmeler.clientWidth - t.offsetWidth) / 2, behavior: "smooth" });
}
const gozcu = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return;
  aktif = +e.target.dataset.i; isaretle(aktif); guncelle(true);
  try { history.replaceState(history.state, "", "#" + BOLUMLER[aktif].id); } catch (x) {}
}), { threshold: 0.55 });
document.querySelectorAll(".bolum").forEach(s => gozcu.observe(s));
document.addEventListener("visibilitychange", () => guncelle());
TEL_DUZEN.addEventListener("change", () => { document.querySelectorAll("video").forEach(v => { if (v.dataset.yol && v.getAttribute("src")) { v.removeAttribute("src"); v.load(); } }); guncelle(); });

function hashOku() { const e = document.getElementById(decodeURIComponent(location.hash.slice(1))); if (e && e.classList.contains("bolum")) e.scrollIntoView(); }
function modeller() { return MODELLER.map(m => ({ kod: m.kod, slug: m.slug, g: GALERI_KOK + m.g, st: 1, duvar: new Set(m.duvar) })); }

// ----- canlıdan (v13.2): geri tuşu, ürün kartı, Tüm modeller, tam ekran video -----
let yigin = [], atla = 0;
function yiginEkle(fn) { try { history.pushState({ kechi: yigin.length + 1 }, ""); yigin.push(fn); } catch (e) {} }
function yiginCik(fn) { const i = yigin.lastIndexOf(fn); if (i < 0) return; yigin.splice(i, 1); try { atla++; history.back(); } catch (e) { atla--; } }
addEventListener("popstate", () => { if (atla > 0) { atla--; return; } const fn = yigin.pop(); if (fn) fn(true); else hashOku(); });

const PERDE_GEREK = () => true;
let perde = null, kartOdak = null, kartYigin = null;
function kartKapat(geriden) {
  if (!acikKart) return;
  acikKart.remove(); acikKart = null;
  if (perde) { perde.remove(); perde = null; }
  document.querySelectorAll(".m.secili").forEach(m => m.classList.remove("secili"));
  if (kartYigin) { const f = kartYigin; kartYigin = null; if (geriden !== true) yiginCik(f); }
  if (kartOdak && kartOdak.focus) { try { kartOdak.focus({ preventScroll: true }); } catch (e) {} }
  kartOdak = null;
}
function kartAc(el, kod, slug, stokta, gorsel) {
  const eskiOdak = acikKart ? kartOdak : document.activeElement, yiginVar = kartYigin;
  if (acikKart) { acikKart.remove(); acikKart = null; document.querySelectorAll(".m.secili").forEach(m => m.classList.remove("secili")); }
  const u = URUN[kod], alt = PERDE_GEREK();
  const k = document.createElement("div");
  k.className = "kart" + (alt ? " alt" : "");
  k.setAttribute("role", "dialog"); k.setAttribute("aria-modal", alt ? "true" : "false"); k.setAttribute("aria-label", u.ad);
  const ust = [kod && "Kod " + kod, u.kumas].filter(Boolean).join(" · ");
  const gal = alt ? "" : (GALERI[slug] || []).map(f => '<img alt="' + u.ad + ' ürün fotoğrafı" loading="lazy" decoding="async" src="' + GALERI_KOK + f + '" onerror="this.remove()">').join("");
  const wa = "https://wa.me/905527488358?text=" + encodeURIComponent("Merhaba, showroomdan yazıyorum. Kod " + kod + " (" + u.ad + ") serisi hakkında bilgi almak istiyorum.");
  k.innerHTML = '<div class="kart-ust"><span class="tut" aria-hidden="true"></span><button type="button" class="kapat" aria-label="Kartı kapat">×</button></div>' +
    '<div class="gal"><img class="kesim" alt="' + u.ad + '" src="' + gorsel + '">' + gal + '</div>' +
    '<div class="bilgi">' +
      '<span class="kod">' + ust + '</span>' +
      '<span class="ad">' + u.ad + '</span>' +
      '<span class="fiyat">Seri ' + TL(u.seri) + ' TL + KDV<small>Adet ' + TL(u.adet) + ' TL + KDV<i class="bed"> · ' + u.beden + '</i></small></span>' +
      '<span class="seri">6\'lı seri · ' + u.beden + '</span>' +
      '<span class="stok' + (stokta ? '' : ' on') + '">' + (stokta ? 'Stokta' : 'Ön sipariş') + '</span>' +
      (u.renkler.length > 1 ? '<span class="renk-baslik">' + u.renkler.length + ' renk, her renk ayrı seri</span><span class="renkler">' +
        u.renkler.map(([c, s]) => '<a href="https://kechiwoman.com/urun/' + s + '" target="_blank" rel="noopener"' + (s === slug ? ' class="bu" aria-current="true"' : '') + '>' + c + '</a>').join("") + '</span>' : '') +
      '<span class="eylem"><a class="ana" href="https://kechiwoman.com/urun/' + slug + '" target="_blank" rel="noopener">Seriyi İncele ve Sipariş Ver</a>' +
      '<a class="ikincil" href="' + wa + '" target="_blank" rel="noopener">Bilgi Al</a>' +
      '<a class="ikincil" href="https://kechiwoman.com/bayilik" target="_blank" rel="noopener">Online Başvuru</a></span>' +
    '</div>';
  k.querySelector(".kapat").addEventListener("click", e => { e.stopPropagation(); kartKapat(); });
  sahne.appendChild(k);
  if (alt) {
    if (!perde) { perde = document.createElement("div"); perde.className = "perde"; perde.addEventListener("click", () => kartKapat()); sahne.insertBefore(perde, k); }
    // aşağı çekince kapanır
    const tut = k.querySelector(".tut"); let y0 = 0, dy = 0;
    tut.addEventListener("touchstart", e => { y0 = e.touches[0].clientY; dy = 0; k.style.transition = "none"; }, { passive: true });
    tut.addEventListener("touchmove", e => { dy = Math.max(0, e.touches[0].clientY - y0); k.style.transform = "translateY(" + dy + "px)"; }, { passive: true });
    tut.addEventListener("touchend", () => { if (dy > 70) kartKapat(); else k.style.transform = ""; });
  } else {
    const r = el.getBoundingClientRect(), s = sahne.getBoundingClientRect(), kw = k.offsetWidth, kh = k.offsetHeight;
    let left = r.right - s.left - r.width * 0.12;
    if (left + kw + 12 > s.width) left = r.left - s.left - kw + r.width * 0.12;
    k.style.left = Math.max(16, Math.min(s.width - kw - 16, left)) + "px";
    k.style.top = Math.max(12, Math.min(s.height - kh - 12, r.top - s.top + r.height * 0.12)) + "px";
  }
  if (el) el.classList.add("secili");
  acikKart = k; kartOdak = eskiOdak;
  if (yiginVar) kartYigin = yiginVar; else { kartYigin = g => kartKapat(g); yiginEkle(kartYigin); }
  k.querySelector(".kapat").focus({ preventScroll: true });
}
// kart ve panel içinde sekme tuşu dışarı çıkmaz
document.addEventListener("keydown", e => {
  if (e.key !== "Tab") return;
  const kok = vPano || (acikKart && acikKart.classList.contains("alt") ? acikKart : null) || (liste && !acikKart ? liste : null);
  if (!kok) return;
  const o = Array.from(kok.querySelectorAll("a[href], button")).filter(x => x.offsetParent !== null);
  if (!o.length) return;
  const a = o[0], z = o[o.length - 1];
  if (!kok.contains(document.activeElement)) { e.preventDefault(); a.focus(); }
  else if (e.shiftKey && document.activeElement === a) { e.preventDefault(); z.focus(); }
  else if (!e.shiftKey && document.activeElement === z) { e.preventDefault(); a.focus(); }
});

let liste = null, listeYigin = null;
function listeKapat(geriden) {
  if (!liste) return;
  const on = liste._odak;
  liste.remove(); liste = null;
  if (listeYigin) { const f = listeYigin; listeYigin = null; if (geriden !== true) yiginCik(f); }
  if (on && on.focus) on.focus({ preventScroll: true });
}
function listeAc(suz) {
  if (liste) return;
  kartKapat();
  const L = document.createElement("section");
  L.className = "liste"; L.setAttribute("role", "dialog"); L.setAttribute("aria-modal", "true"); L.setAttribute("aria-label", "Tüm modeller");
  const hepsi = modeller();
  L.innerHTML = '<div class="liste-ust"><div><h1>Tüm modeller</h1><p>Kış 2026/27 · Wholesale Only · 6\'lı seri · fiyatlar KDV hariç</p></div><button type="button" class="liste-kapat" aria-label="Kapat">×</button></div>' +
    '<div class="liste-suz" role="group" aria-label="Kategori süz"></div><div class="liste-govde"><div class="liste-izgara"></div><div class="liste-son"></div>' +
    '<p class="liste-not">Her renk ayrı seridir. Stok ve fiyat bilgisi ' + VERI_TARIHI + ' tarihli ürün listesinden gelir; güncel durum ürün sayfasındadır.</p></div>';
  const suzEl = L.querySelector(".liste-suz"), izgara = L.querySelector(".liste-izgara"), son = L.querySelector(".liste-son"), govde = L.querySelector(".liste-govde");
  const ciz = n => {
    suzEl.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.n === n)));
    izgara.innerHTML = "";
    hepsi.filter(x => n < 0 || x.duvar.has(n)).forEach(x => {
      const u = URUN[x.kod], b = document.createElement("button");
      b.type = "button"; b.className = "lu";
      b.setAttribute("aria-label", u.ad + ", kod " + x.kod + ", seri kartını aç");
      b.innerHTML = '<span class="g"><img alt="" loading="lazy" decoding="async" src="' + x.g + '"></span><span class="k">Kod ' + x.kod + (u.renk > 1 ? ' · ' + u.renk + ' renk' : '') + '</span><span class="a">' + u.ad + '</span>' +
        '<span class="f">Seri ' + TL(u.seri) + ' TL + KDV</span><span class="fa">adet ' + TL(u.adet) + ' TL + KDV</span><span class="s">' + (x.st ? 'Stokta' : 'Ön sipariş') + '</span>';
      b.addEventListener("click", () => kartAc(null, x.kod, x.slug, x.st, x.g));
      izgara.appendChild(b);
    });
    const kat = n >= 0 ? DUVAR[n] : null;
    son.innerHTML = '<a class="ana" target="_blank" rel="noopener" href="https://kechiwoman.com' + (kat ? kat.url.replace("https://kechiwoman.com", "") : "/yeni-sezon") + '">' + (kat ? kat.ad + ' kategorisinin tamamı' : 'Sitedeki tüm yeni sezon') + '</a><a target="_blank" rel="noopener" href="https://kechiwoman.com/bayilik">Bayi başvurusu</a>';
    govde.scrollTop = 0;
  };
  [["Tümü", -1]].concat(DUVAR.map((d, n) => [d.ad, n])).forEach(([ad, n]) => {
    const b = document.createElement("button"); b.type = "button"; b.dataset.n = n; b.textContent = ad;
    b.addEventListener("click", () => ciz(n)); suzEl.appendChild(b);
  });
  L.querySelector(".liste-kapat").addEventListener("click", () => listeKapat());
  L._odak = document.activeElement;
  sahne.appendChild(L); liste = L;
  ciz(suz == null ? -1 : suz);
  listeYigin = g => listeKapat(g); yiginEkle(listeYigin);
  L.querySelector(".liste-kapat").focus({ preventScroll: true });
}

let vPano = null, vYigin = null;
function videoKapat(geriden) {
  if (!vPano) return;
  const v = vPano.querySelector("video"); vPano._kapali = true; clearTimeout(vPano._zaman); v.pause(); v.removeAttribute("src"); v.load();
  const on = vPano._odak; vPano.remove(); vPano = null;
  guncelle();
  if (vYigin) { const f = vYigin; vYigin = null; if (geriden !== true) yiginCik(f); }
  if (on && on.focus) on.focus({ preventScroll: true });
}
function videoAc(ad) {
  const b = VIDEO[ad], u = URUN[b.k];
  kartKapat();
  const p = document.createElement("div");
  p.className = "vpano"; p.setAttribute("role", "dialog"); p.setAttribute("aria-modal", "true"); p.setAttribute("aria-label", u.ad + " videosu");
  p.dataset.durum = "yukleniyor";
  p.innerHTML = '<div class="vpano-kap"><video muted loop playsinline webkit-playsinline preload="auto" poster="' + VIDEO_KOK + ad + '.jpg" src="' + VIDEO_KOK + (!DOKUNMATIK ? "" : VERI_AZ ? "t/" : "m/") + ad + '.mp4"></video>' +
    '<span class="vpano-yuk" aria-hidden="true"></span><button type="button" class="vpano-oynat" aria-label="Videoyu oynat"><svg viewBox="0 0 24 24" width="30" height="30" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg></button>' +
    '<span class="vpano-hata">Video açılamadı. Ürün sayfasından izleyebilirsiniz.</span></div>' +
    '<div class="vpano-alt"><div><b>' + u.ad + '</b><span>Kod ' + b.k + ' · Seri ' + TL(u.seri) + ' TL + KDV · adet ' + TL(u.adet) + ' TL + KDV</span></div>' +
    '<a target="_blank" rel="noopener" href="https://kechiwoman.com/urun/' + b.u + '">Seriyi gör</a></div>' +
    '<button type="button" class="vpano-kapat" aria-label="Videoyu kapat">×</button>';
  p.querySelector(".vpano-kapat").addEventListener("click", () => videoKapat());
  p._odak = document.activeElement;
  sahne.appendChild(p); vPano = p;
  vYigin = g => videoKapat(g); yiginEkle(vYigin);
  p.querySelector(".vpano-kapat").focus({ preventScroll: true });
  // Dokunusun icinde dogrudan play: iOS dusuk guc modunda autoplay reddedilir, kullanici hareketiyle cagrilan play calisir.
  // Yine reddedilirse oynat dugmesi gorunur; kaynak bozuksa hafif surume, o da olmazsa kapak ve uyariya duser.
  const v = p.querySelector("video"), dur = d => { if (!p._kapali) p.dataset.durum = d; };
  v.muted = true; v.defaultMuted = true;
  guncelle();
  const oynat = () => { const q = v.play(); if (q) q.catch(e => { if (e && e.name !== "AbortError") dur("dokun"); }); };
  v.addEventListener("playing", () => dur("oynuyor"));
  v.addEventListener("waiting", () => dur("yukleniyor"));
  v.addEventListener("pause", () => { if (!p._kapali && !v.error) dur("dokun"); });
  let yedek = false;
  const yedegeGec = () => { if (!yedek) { yedek = true; v.src = VIDEO_KOK + "t/" + ad + ".mp4"; v.load(); oynat(); return true; } return false; };
  v.addEventListener("error", () => { if (p._kapali) return; if (!yedegeGec()) dur("hata"); });
  p.querySelector(".vpano-kap").addEventListener("click", () => { if (p.dataset.durum === "hata") return; if (v.paused) oynat(); else v.pause(); });
  // 6 sn icinde baslamazsa hafif surum denenir (yavas ag, sessiz kalan hata); 12 sn sonunda dokun ya da uyari
  p._zaman = setTimeout(() => {
    if (v.readyState >= 2) { if (v.paused) dur("dokun"); return; }
    yedegeGec();
    p._zaman = setTimeout(() => { if (v.readyState < 2) dur(v.error || v.networkState === 3 ? "hata" : "dokun"); else if (v.paused) dur("dokun"); }, 6000);
  }, 6000);
  oynat();
}

document.getElementById("listeAc").addEventListener("click", () => listeAc(null));
document.addEventListener("keydown", e => {
  if (e.key === "Escape") { if (vPano) videoKapat(); else if (acikKart) kartKapat(); else if (liste) listeKapat(); }
});
if (decodeURIComponent(location.hash.slice(1)) === "modeller") listeAc(null);
</script>
